<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spatial Indicator Dashboard · ข้อมูลจริง พ.ศ. 2567</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF; --shell:#F2EEE6;
    --panel:#F7F4EE; --panel2:#F5F5F0; --line:#EFEBE2;
    --amber:#E8A817; --amber-d:#C07820;
    --text:#1a1a1a; --muted:#5A5652; --hint:#9A9690; --border:#E8E4DC;
    --red:#A03020; --green:#3A6820;
    --accent:#C07820; --accent-d:#9A5E14;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{background:var(--bg);}
  body{
    font-family:"Noto Sans Thai",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--text); background:var(--bg);
    -webkit-font-smoothing:antialiased;
    margin:0; padding:0; min-height:100vh; min-height:100dvh;
  }
  /* full-viewport app shell — no outer frame, no gutter */
  .app{
    width:100%; background:var(--bg); overflow:hidden;
    display:flex; min-height:100vh; min-height:100dvh;
  }

  /* tab bar */
  .tabbar{display:flex; align-items:center; gap:4px; padding:10px 18px; border-bottom:1px solid var(--border); position:sticky; top:0; background:rgba(255,255,255,.95); backdrop-filter:blur(6px); z-index:10; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:9px; margin-right:14px;}
  .brand .mk{width:32px; height:32px; border-radius:9px; background:linear-gradient(145deg,var(--amber),var(--amber-d)); display:flex; align-items:center; justify-content:center; font-size:17px;}
  .brand b{font-size:13px; font-weight:800; letter-spacing:-.01em;}
  .tab{border:none; background:transparent; cursor:pointer; font-family:inherit; font-size:12.5px; font-weight:600; color:var(--hint); padding:9px 14px; border-radius:9px; display:flex; align-items:center; gap:7px; position:relative; transition:color .16s, background .16s;}
  .tab .ic{font-size:14px;}
  .tab:hover{background:var(--panel); color:var(--muted);}
  .tab.active{color:#000; background:var(--panel);}
  .tab.active::after{content:""; position:absolute; left:12px; right:12px; bottom:1px; height:3px; border-radius:3px; background:var(--accent);}

  .view{padding:26px 30px 8px; animation:fade .45s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}

  /* header */
  .head{display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:22px;}
  .kicker{font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--accent-d);}
  h1{font-size:23px; font-weight:800; margin:7px 0 5px; letter-spacing:-.01em;}
  .sub{font-size:13px; color:var(--muted);}
  .period{flex-shrink:0; display:flex; flex-direction:column; align-items:flex-end; gap:5px;}
  .updated{font-size:10.5px; color:var(--hint);}

  /* KPI row */
  .kpis{display:flex; gap:11px; margin-bottom:26px;}
  .kpi{background:var(--panel); border-radius:11px; padding:15px 17px; flex:1; min-width:0; border:1px solid transparent; transition:border-color .15s;}
  .kpi:hover{border-color:var(--border);}
  .kpi .l{font-size:11.5px; color:var(--hint); margin-bottom:7px; line-height:1.3; min-height:30px;}
  .kpi .v{font-size:25px; font-weight:800; line-height:1; display:flex; align-items:center; gap:6px;}
  .kpi .s{font-size:11.5px; color:var(--hint); margin-top:5px;}

  /* section */
  .sec{margin-bottom:26px;}
  .sec h2{font-size:15px; font-weight:800; margin-bottom:11px; display:flex; align-items:center; gap:9px;}
  .sec h2 .bar{width:4px; height:15px; border-radius:2px; background:var(--accent);}
  .sec h2 .meta{font-size:11px; font-weight:500; color:var(--hint); margin-left:auto;}

  /* ranking table */
  .tablewrap{border:1px solid var(--border); border-radius:12px; overflow:hidden;}
  table.rank{width:100%; border-collapse:collapse; font-size:13px;}
  table.rank th{text-align:right; padding:11px 14px; color:var(--hint); font-weight:700; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; background:var(--panel); border-bottom:1px solid var(--border);}
  table.rank th.l{text-align:left;}
  table.rank td{padding:12px 14px; text-align:right; border-bottom:1px solid var(--line); color:var(--text);}
  table.rank tr:last-child td{border-bottom:none;}
  table.rank tr:hover td{background:#FCFBF8;}
  td.l{text-align:left;}
  td.rk{color:var(--hint); font-weight:700; width:34px;}
  td.nm{font-weight:700; text-align:left;}
  .mut{color:var(--muted);}
  .pos-good{color:var(--green); font-weight:700;}
  .neg-bad{color:var(--red); font-weight:700;}
  .neu{color:var(--hint); font-weight:700;}
  .cellbar{display:inline-flex; align-items:center; gap:8px; justify-content:flex-end;}
  .cellbar .t{width:64px; height:7px; background:var(--line); border-radius:4px; overflow:hidden;}
  .cellbar .f{height:100%; border-radius:4px;}
  .bdg{font-size:11px; font-weight:700; padding:3px 11px; border-radius:11px; white-space:nowrap;}
  .b-high{background:#FCEBEB; color:#791F1F;}
  .b-med{background:#FAEEDA; color:#854F0B;}
  .b-low{background:#EAF3DE; color:#27500A;}
  .b-up{background:#EAF3DE; color:#27500A;}
  .b-watch{background:#FAEEDA; color:#854F0B;}
  .b-flat{background:#EEF0F2; color:#4A5560;}
  .b-none{background:#F0EDE7; color:#7A746C;}

  /* small multiples */
  .sm{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
  .smc{background:var(--panel); border-radius:11px; padding:13px 15px;}
  .smh{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px;}
  .smn{font-size:13px; font-weight:700;}
  .smd{font-size:12px; font-weight:700;}
  .smf{display:flex; justify-content:space-between; font-size:11px; color:var(--hint); margin-top:5px;}
  .spark{width:100%; height:46px;}

  /* bottom viz */
  .vizcard{background:var(--panel); border-radius:12px; padding:20px 22px;}
  .mapwrap{display:flex; gap:30px; align-items:flex-start; flex-wrap:wrap;}
  .legend{display:flex; flex-direction:column; gap:9px; min-width:170px;}
  .legend .lt{font-size:10.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:2px;}
  .legrow{display:flex; align-items:center; gap:9px; font-size:12px; color:var(--muted);}
  .legrow .sw{width:15px; height:15px; border-radius:4px; flex-shrink:0;}
  .legrow .dot{width:10px; height:10px; border-radius:50%; background:#FF4400; flex-shrink:0;}
  .legnote{background:#fff; border:1px solid var(--border); border-radius:9px; padding:9px 11px; font-size:11px; color:var(--muted); line-height:1.5; margin-top:4px;}
  .legnote b{color:var(--text);}

  .donutrow{display:flex; gap:28px; align-items:center; flex-wrap:wrap;}
  .dleg{display:flex; flex-direction:column; gap:8px; flex:1; min-width:230px;}
  .dlrow{display:flex; align-items:center; gap:9px; font-size:12.5px;}
  .dlrow .sw{width:11px; height:11px; border-radius:3px; flex-shrink:0;}
  .dlrow .nm{color:var(--muted); flex:1;}
  .dlrow b{font-weight:800;}
  .dlrow .pc{color:var(--hint); width:46px; text-align:right; font-size:11px;}

  .tiles{display:flex; gap:12px; flex-wrap:wrap;}
  .tile{flex:1; min-width:120px; background:#fff; border:1px solid var(--border); border-radius:11px; padding:15px; text-align:center;}
  .tile .e{font-size:26px;}
  .tile .n{font-size:23px; font-weight:900; margin-top:5px;}
  .tile .l{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .splitwrap{margin-top:16px;}
  .splitbar{height:30px; border-radius:8px; overflow:hidden; display:flex; box-shadow:inset 0 0 0 1px var(--border);}
  .splitbar > div{display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:800;}
  .splitlbl{display:flex; justify-content:space-between; font-size:11.5px; color:var(--muted); margin-top:7px;}
  .vizcap{font-size:11.5px; color:var(--hint); font-style:italic; margin-top:12px;}
  .axis{font-size:9px; fill:var(--hint); font-family:inherit;}

  .foot{margin-top:auto; padding:14px 30px; border-top:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; font-size:10.5px; color:var(--hint);}
  .foot .tags{display:flex; gap:6px;}
  .foot .tags span{background:var(--panel); border:1px solid var(--border); padding:3px 9px; border-radius:5px; font-weight:600; letter-spacing:.04em;}

  /* overview tab — main card per domain */
  .ovgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
  .ovcard{background:#fff; border:1px solid var(--border); border-top:4px solid var(--accent); border-radius:14px; padding:16px 18px; display:flex; flex-direction:column; box-shadow:0 8px 24px -22px rgba(40,30,10,.5); transition:box-shadow .2s, transform .2s;}
  .ovcard:hover{box-shadow:0 14px 30px -20px rgba(40,30,10,.5); transform:translateY(-2px);}
  .ovh{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .ovic{width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0;}
  .ovt{display:flex; flex-direction:column; line-height:1.25; min-width:0;}
  .ovt b{font-size:14px; font-weight:800; color:var(--text);}
  .ovt span{font-size:9.5px; color:var(--hint); text-transform:uppercase; letter-spacing:.05em;}
  .ovbadge{margin-left:auto; font-size:10.5px; font-weight:700; padding:3px 10px; border-radius:11px; white-space:nowrap;}
  .ovbadge.alert{background:#FAEEDA; color:#854F0B;}
  .ovbadge.ok{background:#EAF3DE; color:#27500A;}
  .ovmain{padding:10px 0 12px; border-bottom:1px solid var(--line);}
  .ovv{font-size:29px; font-weight:900; line-height:1; display:flex; align-items:center; gap:7px;}
  .ovl{font-size:12.5px; color:var(--text); font-weight:600; margin-top:7px;}
  .ovs{font-size:11.5px; color:var(--hint); margin-top:2px;}
  .ovkpis{display:flex; gap:12px; padding:12px 0 6px;}
  .ovk{flex:1; min-width:0;}
  .ovk .kv{font-size:15px; font-weight:800;}
  .ovk .kl{font-size:10.5px; color:var(--hint); margin-top:2px; line-height:1.3;}
  .ovmore{margin-top:12px; align-self:flex-start; border:1px solid; background:#fff; font-family:inherit; font-size:12.5px; font-weight:700; padding:7px 14px; border-radius:8px; cursor:pointer; transition:background .15s;}
  .ovmore:hover{background:var(--panel);}

  /* ── sidebar nav (Figma 399-9902) ── */
  .sidebar{width:232px; flex-shrink:0; background:#FFFDF3; border-right:1px solid var(--border); display:flex; flex-direction:column; padding:16px 12px;}
  .side-logo{padding:6px 8px 12px; display:flex; align-items:center; justify-content:space-between; gap:10px;}
  #mNavClose{display:none;}   /* desktop rail is always visible — nothing to close */
  .navitem{display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:9px; cursor:pointer; font-size:13.5px; font-weight:600; color:var(--muted); margin-bottom:2px;}
  .navitem .ic{font-size:15px; width:18px; text-align:center;}
  .navitem:hover{background:#FFF4CE;}
  .navitem.active{background:#FDC003; color:#1a1a1a; font-weight:700;}
  .navlabel{font-size:9.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--hint); padding:14px 12px 7px;}
  .side-foot{margin-top:auto; padding:12px; font-size:10px; color:var(--hint); line-height:1.6;}
  .main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topfilter{display:flex; align-items:center; gap:14px; padding:12px 22px; border-bottom:1px solid var(--border); flex-wrap:wrap;}
  .tw{display:flex; align-items:center; gap:9px; font-size:13px; font-weight:600;}
  .tgl{width:34px; height:18px; border-radius:12px; background:#FDC003; position:relative; flex-shrink:0;}
  .tgl::after{content:""; position:absolute; top:2px; left:18px; width:14px; height:14px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .ddf{min-width:150px; height:32px; border:1px solid var(--border); border-radius:8px; display:flex; align-items:center; gap:8px; padding:0 11px; color:var(--hint); font-size:12.5px;}
  .ddf .cv{margin-left:auto; font-size:10px;}
  .tf-right{margin-left:auto; display:flex; align-items:center; gap:10px;}
  .yf{display:flex; align-items:center; gap:6px;}
  .yf .b{width:28px;height:28px;border:1px solid var(--border);border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;}
  .yf .box{height:32px; min-width:82px; border:1px solid var(--border); border-radius:8px; display:flex; align-items:center; justify-content:space-between; padding:0 11px; font-size:13.5px; font-weight:700;}
  /* language toggle — same pill language as .yf .box, two-segment switch */
  .langtoggle{height:32px; border:1px solid var(--border); border-radius:8px; display:flex; align-items:center; padding:2px; gap:2px; background:#fff; flex-shrink:0;}
  .langtoggle button{border:none; background:transparent; height:26px; padding:0 11px; border-radius:6px; font-size:12.5px; font-weight:700; color:var(--muted); cursor:pointer; transition:background .15s,color .15s; font-family:inherit;}
  .langtoggle button.active{background:var(--accent); color:#fff;}
  .langtoggle button:not(.active):hover{background:var(--panel); color:var(--text);}

  /* ── overview 2x2 summary cards ── */
  .ovgrid2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
  .sumcard{background:#fff; border:1px solid var(--border); border-radius:14px; overflow:hidden; box-shadow:0 8px 24px -22px rgba(40,30,10,.4);}
  .sc-h{display:flex; align-items:center; gap:9px; padding:12px 16px; border-bottom:1px solid var(--line); background:#FCFBF7;}
  .sc-ic{width:26px;height:26px;border-radius:7px;background:#FFF3D9;display:flex;align-items:center;justify-content:center;font-size:14px;}
  .sc-h b{font-size:14px; font-weight:800;}
  .sc-go{margin-left:auto; color:var(--hint); font-size:17px; cursor:pointer; width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:7px;}
  .sc-go:hover{background:var(--panel); color:var(--text);}
  .sc-b{padding:15px 16px 17px;}
  .sc-row{display:flex; gap:14px; margin-bottom:14px;}
  .sc-row .sc-m{flex:1; min-width:0;} .sc-row .sc-m.r{text-align:right;}
  .sc-row3{display:flex; gap:12px; margin-bottom:14px;} .sc-row3>div{flex:1; min-width:0;}
  .sc-l{font-size:11px; color:var(--hint); margin-bottom:5px; line-height:1.3;}
  .sc-v{font-size:25px; font-weight:900; color:var(--accent-d); line-height:1;}
  .sc-v.sm{font-size:18px;}
  .sc-v small{font-size:13px; font-weight:700; color:var(--muted);}
  .sc-v2{font-size:19px; font-weight:800; color:var(--text);}
  .sc-delta{font-size:11.5px; color:var(--green); font-weight:800; margin-top:4px;} .sc-delta span{color:var(--hint); font-weight:500;}
  .sc-cap{font-size:11.5px; color:var(--muted); font-weight:600; margin-bottom:9px;}
  .sc-chart{margin-bottom:6px;}
  /* Overview › Ecosystem status trend only. Its viewBox is 110 units tall,
     so this height maps ~1:1 — the card getting wider can no longer flatten it.
     Scoped by .spark-eco so the drill-down small-multiples stay at 46px. */
  .sc-chart-eco{flex-shrink:0; margin-top:2px; margin-bottom:10px;}
  .spark-eco{display:block; width:100%; height:clamp(100px,7.5vw,120px); min-height:100px;}
  .segbar{height:14px; border-radius:999px; overflow:hidden; display:flex; margin-bottom:10px;}
  .segbar>div{height:100%;}
  .seglegend{display:flex; gap:10px 16px; flex-wrap:wrap; font-size:11px; color:var(--muted);}
  .seglegend span{display:flex; align-items:center; gap:5px;}
  .seglegend i{width:9px;height:9px;border-radius:2px;}

  @media(max-width:1000px){ .kpis{flex-wrap:wrap;} .kpi{flex:1 1 30%;} .sm{grid-template-columns:repeat(2,1fr);} .ovgrid{grid-template-columns:repeat(2,1fr);} }

  /* Land Phase 2 token overrides */
  :root{--amber:#FDC003;--amber-d:#BA6903;--text:#1a1a1a;--muted:#5A5652;--hint:#9A9690;--panel:#F5F5F5;--line:#E5E5E5;--border:#D4D4D4;--bg:#FFFFFF;--shell:#FAFAFA;--red:#A03020;--green:#3A6820;--accent:#FDC003;--accent-d:#BA6903;}
  /* ── real spatial map (MapLibre GL) — single instance, moved between tabs ── */
  /* bleeds past the content column's side padding only — flush against the
     sidebar on the left and the app card's own edge on the right. The app
     shell itself (rounded corners/shadow/max-width) is untouched. */
  .mapsec{margin:0 -30px;}
  .mapsec > h2{padding:0 30px;}
  .geomapwrap{
    position:relative; height:460px;
    overflow:hidden; border-top:1px solid var(--border); border-bottom:1px solid var(--border);
    background:#EAE6DC; margin-top:4px;
  }
  #lxmap{position:absolute; inset:0;}
  .geomapwrap .maplibregl-ctrl-attrib{font-size:8px; background:rgba(255,255,255,.6);}
  /* true full screen via the Fullscreen API — the only way the map exceeds its card size */
  .geomapwrap:fullscreen{height:100vh; width:100vw; border:none; margin:0;}
  .geomapwrap:-webkit-full-screen{height:100vh; width:100vw; border:none; margin:0;}

  .mapctl{position:absolute; left:12px; bottom:12px; display:flex; gap:8px; z-index:5;}
  .mapctl .mb{width:36px;height:36px;border-radius:9px;background:#fff;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--muted);cursor:pointer;box-shadow:0 2px 6px -3px rgba(0,0,0,.4);}
  .mapctl .mb:hover{color:var(--text);}

  /* ── Layer panel — Figma "Layer panel - Overall Page" (node 333:12237) ── */
  .lp-panel{
    position:absolute; top:14px; right:14px; z-index:6; width:296px;
    background:#fff; border-radius:10px; padding:6px 6px 10px; display:flex; flex-direction:column;
    box-shadow:0 12px 26px -14px rgba(0,0,0,.3); max-height:calc(100% - 28px); overflow:hidden;
  }
  .lp-header{display:flex; align-items:center; gap:4px; padding:2px 2px 10px 10px; flex-shrink:0;
             border-bottom:1px solid #EDEDED; margin-bottom:2px;}
  .lp-header p{flex:1; font-size:14px; font-weight:600; color:#171717;}
  .lp-iconbtn{display:flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:6px; border:none; background:transparent; cursor:pointer; color:#171717; flex-shrink:0; font-size:14px;}
  .lp-iconbtn:hover{background:#F5F5F5;}
  .lp-body{flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column;}

  .lp-layer{padding:14px 10px 16px; display:flex; flex-direction:column;
            border-bottom:1px solid #E5E5E5; flex-shrink:0;}
  .lp-layer:first-child{padding-top:10px;}
  .lp-layer:last-child{border-bottom:none; padding-bottom:4px;}
  /* the head wraps: "บริเวณพื้นที่ป่าที่เกิดการเปลี่ยนแปลง" needs two lines */
  .lp-layer-head{display:flex; align-items:flex-start; gap:8px; min-height:28px; margin-bottom:12px;}
  .lp-layer-head .nm{flex:1; font-size:13.5px; font-weight:700; color:#171717; line-height:1.35; padding-top:1px;}
  .lp-layer-head .lp-toggle, .lp-layer-head .lp-iconbtn-sm{margin-top:3px;}
  .lp-iconbtn-sm{display:flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:6px; border:none; background:transparent; cursor:pointer; color:#525252; flex-shrink:0; font-size:12px;}
  .lp-iconbtn-sm:hover{background:#F5F5F5;}

  .lp-toggle{position:relative; width:36px; height:18px; flex-shrink:0; display:inline-block;}
  .lp-toggle input{position:absolute; inset:0; opacity:0; margin:0; cursor:pointer; z-index:1; width:100%; height:100%;}
  .lp-toggle .track{position:absolute; inset:0; border-radius:9999px; background:#E3E3E3; transition:background .15s;}
  .lp-toggle .knob{position:absolute; top:3px; left:3px; width:12px; height:12px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.25); transition:left .15s;}
  .lp-toggle input:checked ~ .track{background:#FDC003;}
  .lp-toggle input:checked ~ .knob{left:21px;}

  .lp-caption{font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
              color:#8A8580; margin-bottom:8px;}
  .lp-swatchrow{display:flex; align-items:center; gap:9px;}
  .lp-swatchrow + .lp-swatchrow{margin-top:6px;}
  .lp-swatch{width:12px; height:12px; border-radius:3px; flex-shrink:0;}
  .lp-swatchrow span:last-child{font-size:12px; color:#525252; line-height:1.35;}
  /* per-layer caveat, replacing the panel-wide banner */

  .lp-slider::-moz-range-thumb{width:16px; height:16px; border-radius:50%; background:#242424; border:1px solid #757575; box-shadow:0 1px 4px rgba(12,13,13,.15);}

  .lp-reopen{

  .maplibregl-popup-content{padding:0!important;border-radius:10px!important;overflow:hidden;box-shadow:0 16px 40px -16px rgba(0,0,0,.45)!important;font-family:"Noto Sans Thai",sans-serif;}

    box-shadow:0 16px 40px -16px rgba(0,0,0,.42);font-family:"Noto Sans Thai",sans-serif;overflow:hidden;}

    font-size:12.5px;font-weight:700;color:#171717;line-height:1.35;}

  .mtopbar{display:none;}

    .tf-right{margin-left:0; width:100%; justify-content:space-between;}

    .kpis{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:20px;}

    .tablewrap{overflow-x:auto; -webkit-overflow-scrolling:touch;}

    .vizcard{padding:16px 14px; overflow-x:auto; -webkit-overflow-scrolling:touch;}

    .sc-chart{overflow-x:auto; -webkit-overflow-scrolling:touch;}

    .mapsec{margin:0 -14px;}

    .geomapwrap{height:340px;}
    .mapctl{left:10px; bottom:10px;}

    #lxDrawer{width:100%;}
    #lxTip{max-width:min(300px,calc(100vw - 24px));}
    .foot{padding:12px 14px;}

const rai = n => Number(n).toLocaleString("en-US")+" ไร่";

/* ══════════ chart tooltip engine ══════════ */
function tipEsc(x){ return String(x).replace(/&/g,"&amp;").replace(/"/g,"&quot;"); }
function TIP(o){
  const rows=(o.rows||[]).map(r=>
    `<div class="ct-r">${r.sw?`<span class="tt-sw" style="background:${r.sw}"></span>`:""}`+
    `<span>${r.l}</span><b${r.c?` style="color:${r.c}"`:""}>${r.v}</b></div>`).join("");
  const html=`<div class="ct-h">${o.t}${o.sub?`<small>${o.sub}</small>`:""}</div>`+
             (rows?`<div class="ct-b">${rows}</div>`:"")+
             (o.foot?`<div class="ct-f">${o.foot}</div>`:"");
  return ` data-tip="${tipEsc(html)}"`;
}
(function(){
  let el=null;
  function box(){ return el || (el=document.getElementById("lxTip")); }
  document.addEventListener("mouseover",e=>{
    const t=e.target.closest && e.target.closest("[data-tip]");
    if(!t) return;
    const b=box(); if(!b) return;
    b.innerHTML=t.getAttribute("data-tip"); b.classList.add("on");
  });
  document.addEventListener("mouseout",e=>{
    const t=e.target.closest && e.target.closest("[data-tip]");
    if(!t) return;
    const b=box(); if(b) b.classList.remove("on");
  });
  document.addEventListener("mousemove",e=>{
    const b=box(); if(!b || !b.classList.contains("on")) return;
    const r=b.getBoundingClientRect();
    let x=e.clientX+14, y=e.clientY+14;
    if(x+r.width>innerWidth-8)  x=e.clientX-r.width-14;
    if(y+r.height>innerHeight-8) y=e.clientY-r.height-14;
    b.style.left=Math.max(8,x)+"px"; b.style.top=Math.max(8,y)+"px";
  });
})();

function natShare(v){ return (v/LANDX.national.areaRai*100).toFixed(2)+"%"; }

                           no English form exists (never breaks)

   keep their Thai fields; English is a display-time transform only, so
   toggling language can never change a number.
   ══════════════════════════════════════════════════════════════════════ */
let LANG = (function(){
  /* default this embedded demo to English mode unless a session explicitly chose Thai */
  try{ const v=localStorage.getItem("lx-lang"); return v==="th"?"th":"en"; }
  catch(e){ return "en"; }
}());
function LSET(lang){
  LANG = lang;
  try{ localStorage.setItem("lx-lang", lang); }catch(e){}
}

<script>
const fmt=n=>n.toLocaleString("en-US");
const YEARS=["2564","2565","2566","2567","2568"];
const TH_MONTHS=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];

/* ── chart helpers — all dataset-driven, all hoverable ── */
/* opts: {label, unit, years, fmtV, loc, cat} — every point states value/period/location */
/* A dot that stays a perfect circle even inside a non-uniformly scaled
   SVG: a zero-length subpath with a round line-cap paints a disc whose
   diameter is the stroke width, and `non-scaling-stroke` measures that
   width in device pixels — so the viewBox stretch can never turn it into
   an ellipse. r is the radius the equivalent <circle> would have had. */
function LXDOT(x,y,r,color){
  return `<path d="M${x.toFixed(1)} ${y.toFixed(1)}L${x.toFixed(1)} ${y.toFixed(1)}" `+
    `stroke="${color}" stroke-width="${(r*2).toFixed(2)}" stroke-linecap="round" `+
    `vector-effect="non-scaling-stroke" fill="none" pointer-events="none"/>`;
}
function spark(data,color,opts){
  const o=opts||{}, yrs=o.years||LANDX.meta.years;
  const w=o.w||160,h=o.h||46,p=o.p||5,lo=Math.min(...data),hi=Math.max(...data);
  const X=i=>p+(i/(data.length-1))*(w-2*p), Y=v=>p+(1-(v-lo)/((hi-lo)||1))*(h-2*p);
  const d=data.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(" ");
  const fv=o.fmtV||(v=>fmt(v)+" "+(o.unit||"ไร่"));
  const dots=data.map((v,i)=>{
    const yr=yrs[i%yrs.length];
    const prev=i>0?data[i-1]:null;
    const dl=prev!=null?((v-prev)/prev*100):null;
    return `<circle class="hv" cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="7" fill="transparent"`+
      TIP({t:o.label||"แนวโน้ม", sub:(o.loc||L("ประเทศไทย"))+" · พ.ศ. "+yr,
           rows:[{l:L("ค่า"),v:fv(v),sw:color},
                 {l:L("ช่วงเวลา"),v:"พ.ศ. "+yr},
                 ...(o.cat?[{l:L("หมวด"),v:o.cat}]:[]),
                 ...(dl!=null?[{l:L("เทียบปีก่อน"),v:(dl>0?"+":"")+dl.toFixed(1)+"%",c:dl>0?"#A41210":"#14673C"}]:[])],
           foot:o.note||L(MOCKNOTE)})+`/>`+
      LXDOT(X(i),Y(v),i===data.length-1?3:1.8,color);
  }).join("");
  return `<svg class="spark${o.cls?" "+o.cls:""}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" vector-effect="non-scaling-stroke"/>${dots}</svg>`;
}
/* segs: [{name,value,color,disp,catId}] */
function donut(segs,total,top,bottom,size=150,th=26,opts){
  const o=opts||{};
  const r=(size-th)/2,cx=size/2,cir=2*Math.PI*r;let acc=0;
  const c=segs.map(sg=>{
    const f=sg.value/total,dd=f*cir;
    const e=`<circle class="hv" cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${sg.color}" stroke-width="${th}"
      stroke-dasharray="${dd} ${cir-dd}" stroke-dashoffset="${-acc*cir}" transform="rotate(-90 ${cx} ${cx})"`+
      TIP({t:sg.name, sub:(o.loc||L("ประเทศไทย"))+" · "+L(YR),
           rows:[{l:L("พื้นที่"),v:sg.disp!=null?sg.disp:fmt(sg.value)+" ไร่",sw:sg.color},
                 {l:L("สัดส่วน"),v:(f*100).toFixed(2)+"%"},
                 {l:L("หมวด"),v:o.catLabel||L("การใช้ประโยชน์ที่ดิน")},
                 {l:L("ช่วงเวลา"),v:L(YR)}],
           foot:(o.foot||"")+(o.foot?" · ":"")+(o.note||L(MOCKNOTE))})+`/>`;
    acc+=f;return e;}).join("");
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
    <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="#EAE5DB" stroke-width="${th}"/>${c}
    <text x="${cx}" y="${cx-2}" text-anchor="middle" font-size="21" font-weight="900" fill="var(--text)" pointer-events="none">${top}</text>
    <text x="${cx}" y="${cx+15}" text-anchor="middle" font-size="10" fill="var(--hint)" pointer-events="none">${bottom}</text></svg>`;
}
function dlegend(segs,total,opts){
  const o=opts||{};
  return `<div class="dleg">`+segs.map(sg=>
    `<div class="dlrow hv"`+TIP({t:sg.name,sub:(o.loc||L("ประเทศไทย"))+" · "+L(YR),
      rows:[{l:L("พื้นที่"),v:sg.disp!=null?sg.disp:fmt(sg.value)+" ไร่",sw:sg.color},
            {l:L("สัดส่วน"),v:total?((sg.value/total)*100).toFixed(2)+"%":"—"},
            {l:L("ช่วงเวลา"),v:L(YR)}],foot:o.note||L(MOCKNOTE)})+
    `><span class="sw" style="background:${sg.color}"></span><span class="nm">${sg.name}</span>`+
    `<b>${sg.disp!=null?sg.disp:fmt(sg.value)}</b>`+
    `<span class="pc">${total?((sg.value/total)*100).toFixed(1)+'%':''}</span></div>`).join("")+`</div>`;
}
/* vals in rai; peak months highlighted */
function monthBars(vals,color,opts){
  const o=opts||{}, tot=vals.reduce((x,y)=>x+y,0), mx=Math.max(...vals), pk=vals.indexOf(mx);
  const w=620,h=160,pL=30,pB=22,pT=10,pR=8,max=mx*1.12,bw=(w-pL-pR)/12;
  const Y=v=>pT+(1-v/max)*(h-pT-pB);
  const ax=v=>v>=1e6?(v/1e6).toFixed(1)+"M":v>=1e3?Math.round(v/1e3)+"K":Math.round(v);
  const ticks=[0,max/2,max].map(v=>`<line x1="${pL}" y1="${Y(v).toFixed(1)}" x2="${w-pR}" y2="${Y(v).toFixed(1)}" stroke="rgba(0,0,0,.05)"/><text x="${pL-6}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end" class="axis">${ax(v)}</text>`).join("");
  const bars=vals.map((v,i)=>{
    const x=pL+i*bw+bw*.16,bwi=bw*.68,y=Y(v);
    return `<rect class="hv" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bwi.toFixed(1)}" height="${(h-pB-y).toFixed(1)}" rx="3" fill="${i>=6&&i<=9?color:'#9FC0DC'}"`+
      TIP({t:MN(i)+" "+L("พ.ศ. "+(o.yearBE||LANDX.meta.reportingYearBE)), sub:(o.loc||L("ประเทศไทย"))+" · "+L("พื้นที่น้ำท่วม"),
        rows:[{l:L("พื้นที่น้ำท่วม"),v:fmt(v)+" "+L("ไร่"),sw:i>=6&&i<=9?color:'#9FC0DC'},
              {l:L("สัดส่วนทั้งปี"),v:(v/tot*100).toFixed(1)+"%"},
              {l:L("ช่วงเวลา"),v:MN(i)+" "+L("พ.ศ. "+(o.yearBE||2567))},
              {l:L("หมวด"),v:L("สถานการณ์ภัยพิบัติ — น้ำท่วม")},
              ...(i===pk?[{l:L("สถานะ"),v:L("เดือนพีค"),c:"#A41210"}]:[])],
        foot:L("รวมทั้งปี")+" "+fmt(tot)+" "+L("ไร่")+" · "+(o.note||L(MOCKNOTE))})+`/>`+
      `<text x="${(x+bwi/2).toFixed(1)}" y="${h-7}" text-anchor="middle" class="axis" pointer-events="none">${MN(i)}</text>`;}).join("");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%">${ticks}${bars}</svg>`;
}

/* Thailand schematic map + legend (forest tab) — values now come from the dataset */
const MAP_SHAPES={
 north:      {poly:"38,10 174,10 181,46 177,124 126,130 42,124 23,82",cx:101,cy:66,short:"ภาคเหนือ"},
 northeast:  {poly:"177,10 214,10 218,66 211,148 180,146 177,90 181,46",cx:198,cy:74,short:"ตะวันออกเฉียงเหนือ"},
 central:    {poly:"42,124 126,130 177,124 180,146 172,208 88,203 44,184",cx:108,cy:166,short:"กลาง"},

 east:       {poly:"172,146 211,148 214,208 174,204 172,175",cx:192,cy:174,short:"ออก"},
 south:      {poly:"68,203 140,203 134,242 124,287 113,326 100,344 87,344 74,326 64,287 52,242",cx:97,cy:270,short:"ใต้"},
};
const FOREST_RAMP=[[350000,"#6E4708","สูงมาก (350K+)"],[250000,"#945E0C","สูง (250–349K)"],
                   [200000,"#9C6410","ปานกลาง–สูง (200–249K)"],[100000,"#D6A43A","ปานกลาง (100–199K)"],
                   [0,"#E3B156","ต่ำ (<100K)"]];
function forestShade(v){ for(const [t,c] of FOREST_RAMP) if(v>=t) return c; return "#E3B156"; }
function forestMap(){
  const natC=LANDX.national.forestChange2568.change;
  const regs=LANDX.regions.map(r=>({r,v:r.forestChange2568.change})).sort((a,b)=>b.v-a.v);
  const shapes=LANDX.regions.map(r=>{
    const sh=MAP_SHAPES[r.regionId], v=r.forestChange2568.change, fc=r.forestChange2568;
    const col=forestShade(v), light=v>=200000;
    const top=[...r.provinceIds].map(p=>LX_PROV[p]).sort((a,b)=>b.forestChange2568.change-a.forestChange2568.change)[0];
    return `<g class="hv"`+TIP({t:r.nameTH,sub:r.nameEN+" · "+L(YR),
      rows:[{l:L("ป่าเปลี่ยนแปลง"),v:fmt(v)+" ไร่",sw:col},
            {l:L("สัดส่วนของประเทศ"),v:(v/natC*100).toFixed(1)+"%"},
            {l:L("สูญเสีย"),v:fmt(fc.loss)+" ไร่",sw:"#D04030"},
            {l:L("ฟื้นตัว"),v:fmt(fc.gain)+" ไร่",sw:"#2F8E6A"},
            {l:L("สมดุลสุทธิ"),v:fmt(fc.net)+" ไร่",c:fc.net<0?"#A41210":"#14673C"},
            {l:L("จังหวัดสูงสุด"),v:top.nameTH+" ("+fmt(top.forestChange2568.change)+")"},
            {l:L("ช่วงเวลา"),v:L(YR)}],
      foot:r.provinceIds.length+" จังหวัด · "+L(MOCKNOTE)})+`>
      <polygon points="${sh.poly}" fill="${col}" stroke="rgba(0,0,0,.25)" stroke-width="1.2"/>
      <text x="${sh.cx}" y="${sh.cy}" text-anchor="middle" fill="${light?'#FFE8B0':'#4A2C00'}" font-size="9" font-weight="700" pointer-events="none">${sh.short}</text>
      <text x="${sh.cx}" y="${sh.cy+14}" text-anchor="middle" fill="${light?'#FFCF70':'#5A3800'}" font-size="12.5" font-weight="900" pointer-events="none">${Math.round(v/1000)}K</text></g>`;
  }).join("");
  // one dot per province, positioned inside its region shape
  const dots=LANDX.regions.map(r=>{
    const sh=MAP_SHAPES[r.regionId];
    return r.provinceIds.map((pid,k)=>{
      const p=LX_PROV[pid], ang=k*2.39996, rad=13+k*3;
      const x=sh.cx+Math.cos(ang)*rad, y=sh.cy+Math.sin(ang)*rad+16;
      return `<circle class="hv" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.4" fill="#FF4400" opacity=".9"
        onclick="openProvinceDetail('${pid}')" style="cursor:pointer"`+
        TIP({t:p.nameTH,sub:p.nameEN+" · "+r.nameTH+" · "+L(YR),
          rows:[{l:L("ป่าเปลี่ยนแปลง"),v:fmt(p.forestChange2568.change)+" ไร่"},
                {l:L("สูญเสีย"),v:fmt(p.forestChange2568.loss)+" ไร่",sw:"#D04030"},
                {l:L("ฟื้นตัว"),v:fmt(p.forestChange2568.gain)+" ไร่",sw:"#2F8E6A"},
                {l:L("ช่วงเวลา"),v:L(YR)}],foot:"คลิกเพื่อเจาะลึกจังหวัด · "+L(MOCKNOTE)})+`/>`;
    }).join("");
  }).join("");
  const map=`<svg viewBox="0 0 224 360" width="210" height="338" role="img" aria-label="แผนที่ไทย 6 ภาค ความเข้มตามขนาดพื้นที่ป่าที่เปลี่ยนแปลง">
    <rect width="224" height="360" fill="#DCEAF2" rx="6"/>${shapes}${dots}</svg>`;
  const two=regs.slice(0,2);
  const legend=`<div class="legend">
    <div class="lt">ความเข้ม = ขนาดพื้นที่เปลี่ยนแปลง</div>
    ${FOREST_RAMP.map(([t,c,l])=>`<div class="legrow"><span class="sw" style="background:${c}"></span>${l}</div>`).join("")}
    <div class="legrow" style="margin-top:3px"><span class="dot"></span>จังหวัด (คลิกเพื่อเจาะลึก)</div>
    <div class="legnote"><b>พื้นที่เร่งด่วน:</b> ${two.map(x=>x.r.nameTH).join(" + ")} รวม ${Math.round((two[0].v+two[1].v)/1000)}K ไร่ (${((two[0].v+two[1].v)/natC*100).toFixed(0)}%)</div>
  </div>`;
  return `<div class="mapwrap">${map}${legend}</div>`;
}

function wireMapNode(el){
  el.querySelectorAll(".ml-toggle").forEach(cb=>{
    cb.onchange=()=>setGroupVisible(cb.dataset.group, cb.checked);
  });
  el.querySelectorAll(".ml-opacity").forEach(sl=>{
    sl.oninput=()=>{
      const id=sl.dataset.layer;
      const out=el.querySelector(`.out[data-out="${id}"]`);
      if(out) out.textContent=sl.value+"%";
      LAYER_OPACITY[id]=+sl.value/100;
      if(lxMap && lxMap.getLayer(id))
        lxMap.setPaintProperty(id, LAYER_OPACITY_PROP[id]||"fill-opacity", LAYER_OPACITY[id]);
    };
  });
  const panel=el.querySelector("#mapLegend"), reopen=el.querySelector("#lpReopen");
  const setPanel=on=>{ panel.style.display=on?"flex":"none"; reopen.style.display=on?"none":"flex"; };
  el.querySelector("#lpClose").onclick=()=>setPanel(false);
  reopen.onclick=()=>setPanel(true);
  /* the panel is a bottom sheet on a phone and would cover half the map,
     so it starts collapsed to its pill there and opens on demand */
  if(LXMQ("(max-width:600px)").matches) setPanel(false);
  el.querySelector("#mapIn").onclick=()=>lxMap&&lxMap.zoomIn();
  el.querySelector("#mapOut").onclick=()=>lxMap&&lxMap.zoomOut();
  el.querySelector("#mapHome").onclick=()=>lxMap&&lxMap.flyTo({center:[100.99,13.60],zoom:5.05});
  el.querySelector("#mapFs").onclick=()=>{
    if(document.fullscreenElement) document.exitFullscreen();
    else if(el.requestFullscreen) el.requestFullscreen();
  };
  document.addEventListener("fullscreenchange",()=>{ if(lxMap) setTimeout(()=>lxMap.resize(),80); });
  if(window.ResizeObserver) new ResizeObserver(()=>{ if(lxMap) lxMap.resize(); }).observe(el);
}

function setGroupVisible(group,on){
  if(!lxMap||!mapReady) return;
  (LAYER_GROUPS[group]||[]).forEach(id=>{
    if(lxMap.getLayer(id)) lxMap.setLayoutProperty(id,"visibility", on?"visible":"none");
  });
}
function applyTabLayers(tab){
  const on=TAB_LAYERS[tab]||TAB_LAYERS.overview;
  if(mapNode) mapNode.querySelectorAll(".ml-toggle").forEach(cb=>{ cb.checked=on.includes(cb.dataset.group); });
  if(!mapReady){ pendingTab=tab; return; }
  Object.keys(LAYER_GROUPS).forEach(g=>setGroupVisible(g,on.includes(g)));
}

function ensureMap(){
  if(lxMap) return;
  const host=mapNode.querySelector("#lxmap");
  if(typeof maplibregl==="undefined"){
    host.innerHTML=`<div style="display:grid;place-items:center;height:100%;text-align:center;padding:24px;
      font-size:13px;color:#9A5800;background:#FFF6E0;line-height:1.6">
      <div><b>${L("ไม่สามารถโหลดไลบรารีแผนที่ (MapLibre GL) ได้")}</b><br>
      ${L("ตรวจสอบการเชื่อมต่ออินเทอร์เน็ต แล้วรีเฟรชหน้าอีกครั้ง")}</div></div>`;
    return;
  }
  lxMap=new maplibregl.Map({
    container:host, center:[100.99,13.60], zoom:5.05, attributionControl:{compact:true},
    /* On a phone the map sits inside a scrolling page, so one-finger drag
       must keep scrolling the page — MapLibre asks for two fingers instead.
       Desktop keeps its normal drag/scroll behaviour. */
    cooperativeGestures: LXMQ("(max-width:860px)").matches,
    style:lxBaseStyle()
  });
  lxMap.addControl(new maplibregl.NavigationControl({showCompass:false}),"top-left");
  lxMap.addControl(new maplibregl.ScaleControl({unit:"metric"}),"bottom-right");

  lxMap.on("load",()=>{
    /* ═══ REAL GISTDA LAYERS, ปี พ.ศ. 2567 ═══════════════════════════════
       Source type is `vector`, not geojson: GISTDA serves Mapbox Vector
       Tiles through Vallaris, the tile hosts send permissive CORS headers
       and the api_key rides in the tile URL — so these load straight from
       a local file with no proxy, no build step and no login.           */

    /* Land use — one fill, coloured by the real `landuse_code1` attribute
       (A/F/U/M/W) using GISTDA's own map-style palette. Tiles are heavy
       (3–11 MB at z5–z8), so first paint at national zoom takes a moment. */
    lxMap.addSource("lu2567",{ type:"vector", tiles:[LX2567.landuse.tiles],
      minzoom:LX2567.landuse.minzoom, maxzoom:LX2567.landuse.maxzoom,
      bounds:LX2567.landuse.bbox,
      attribution:"การใช้ประโยชน์ที่ดิน" });
    lxMap.addLayer({ id:"lu2567-fill", type:"fill", source:"lu2567",
      "source-layer":LX2567.landuse.sourceLayer,
      paint:{ "fill-color":["match",["get","landuse_code1"],
                "A",LU2567_BY_ID.agri.color,  "F",LU2567_BY_ID.forest.color,
                "U",LU2567_BY_ID.urban.color, "M",LU2567_BY_ID.misc.color,
                "W",LU2567_BY_ID.water.color, "#BDBDBD"],
              "fill-opacity":LAYER_OPACITY["lu2567-fill"],
              "fill-outline-color":"rgba(0,0,0,0)" }});

    /* Flood — national coverage, single class */
    lxMap.addSource("fl2567",{ type:"vector", tiles:[LX2567.flood.tiles],
      minzoom:LX2567.flood.minzoom, maxzoom:LX2567.flood.maxzoom,
      bounds:LX2567.flood.bbox,
      attribution:"พื้นที่น้ำท่วม" });
    lxMap.addLayer({ id:"fl2567-fill", type:"fill", source:"fl2567",
      "source-layer":LX2567.flood.sourceLayer,
      paint:{"fill-color":LX2567.flood.color,"fill-opacity":LAYER_OPACITY["fl2567-fill"]}});
    lxMap.addLayer({ id:"fl2567-line", type:"line", source:"fl2567",
      "source-layer":LX2567.flood.sourceLayer,
      paint:{"line-color":"#0B6E9C","line-width":0.5,"line-opacity":0.65}});

    /* LandTrendr 2567 — the offline point layer. Added last so it paints
       above the vector fills. Radius tracks the real ~147 m footprint of
       one z10 pixel, so the cloud reads at the right density as you zoom. */
    const lt=ltGet2567();
    lxMap.addSource("landtrendr-2567",{type:"geojson",data:lt.fc});
    lxMap.addLayer({ id:"landtrendr-2567-pts", type:"circle", source:"landtrendr-2567",
      paint:{ "circle-radius":["interpolate",["exponential",2],["zoom"],
                4,0.6, 6,0.9, 8,1.6, 10,3.2, 12,10, 14,38],
              "circle-color":LT_DOT_COLOR,
              "circle-opacity":LAYER_OPACITY["landtrendr-2567-pts"],
              "circle-blur":0.2 }});

    /* Place names belong on top of the data, not under it — the thematic
       layers were appended after the basemap, so lift the labels back. */
    LX_BASE_LABELS.forEach(id=>{ if(lxMap.getLayer(id)) lxMap.moveLayer(id); });

    addMapInteractions();
    mapReady=true;
    applyTabLayers(pendingTab||"overview");
    pendingTab=null;
    lxMap.resize();
  });
  lxMap.on("error",e=>console.warn("[map]",e&&e.error?e.error.message:e));
}

function addMapInteractions(){
  const HIT={ "lu2567-fill":realLanduseTooltip, "fl2567-fill":realFloodTooltip };
  let popup=null;
  const show=(e,html)=>{
    if(!popup) popup=new maplibregl.Popup({closeButton:false,closeOnClick:false,maxWidth:"320px",offset:12});
    popup.setLngLat(e.lngLat).setHTML(html).addTo(lxMap);
  };
  const hide=()=>{ lxMap.getCanvas().style.cursor=""; if(popup){popup.remove();popup=null;} };
  Object.keys(HIT).forEach(layerId=>{
    lxMap.on("mousemove", layerId, e=>{
      if(!e.features||!e.features.length) return;
      lxMap.getCanvas().style.cursor="pointer";
      show(e, HIT[layerId](e.features[0].properties));
    });
    lxMap.on("mouseleave", layerId, hide);
  });
  lxMap.on("mousemove","landtrendr-2567-pts",e=>{
    lxMap.getCanvas().style.cursor="crosshair";
    show(e, ltTooltipHTML(e.lngLat));
  });
  lxMap.on("mouseleave","landtrendr-2567-pts", hide);
}

function sparkline(obj,color,w=220,h=48){
  const ys=LANDX.meta.years.map(y=>obj[String(y)]);
  const lo=Math.min(...ys), hi=Math.max(...ys), pad=4;
  const X=i=>pad+i*(w-2*pad)/(ys.length-1);
  const Y=v=>pad+(1-(v-lo)/((hi-lo)||1))*(h-2*pad);
  const d=ys.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(" ");
  const pts=ys.map((v,i)=>LXDOT(X(i),Y(v),2.6,color)+
    `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="6" fill="transparent"><title>${LANDX.meta.years[i]}: ${rai(v)}</title></circle>`).join("");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/>${pts}</svg>`;
}

/* move the single map node into the current tab's slot, then resize */
function initMap(tab){
  const slot=document.getElementById("mapSlot");

  if(!mapNode) mapNode=buildMapNode();

}

   Each domain is bound to the dataset that actually measures it. Where
   GISTDA publishes no equivalent (province severity, Eco Plant) the mock
   is left in place and labelled as such, never mixed into a real total.  */

/* ── a bar chart for real year series (LandTrendr, annual flood) ────── */
function yearBars(items,opts){
  const o=opts||{}, n=items.length;
  const w=Math.max(620,n*22), h=170, pL=38, pB=26, pT=10, pR=8;
  const mx=Math.max(...items.map(d=>d.v)), max=mx*1.12;
  const bw=(w-pL-pR)/n;
  const Y=v=>pT+(1-v/max)*(h-pT-pB);
  const ax=v=>v>=1e6?(v/1e6).toFixed(1)+"M":v>=1e3?Math.round(v/1e3)+"K":Math.round(v);
  const ticks=[0,max/2,max].map(v=>
    `<line x1="${pL}" y1="${Y(v).toFixed(1)}" x2="${w-pR}" y2="${Y(v).toFixed(1)}" stroke="rgba(0,0,0,.05)"/>`+
    `<text x="${pL-6}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end" class="axis">${ax(v)}</text>`).join("");
  const bars=items.map((d,i)=>{
    const x=pL+i*bw+bw*.15, bwi=bw*.70, y=Y(d.v);
    return `<rect class="hv" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bwi.toFixed(1)}" `+
      `height="${Math.max(0,h-pB-y).toFixed(1)}" rx="2.5" fill="${d.c||o.color||"var(--accent)"}"`+
      TIP({t:d.t||d.label, sub:o.sub||L("ประเทศไทย"),
        rows:(d.rows||[{l:o.vLabel||L("ค่า"),v:fmt(Math.round(d.v))+" "+L(o.unit||"ไร่"),sw:d.c||o.color}]),
        foot:o.note||SRC_LT})+`/>`+
      (i%o.every===0?`<text x="${(x+bwi/2).toFixed(1)}" y="${h-8}" text-anchor="middle" class="axis" pointer-events="none">${d.label}</text>`:"");
  }).join("");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" preserveAspectRatio="xMidYMid meet">${ticks}${bars}</svg>`;
}

   Every string below is resolved through L()/CN()/PN()/RN()/L2N() at
   BUILD time, so the whole block is wrapped in a function and re-run
   whenever LANG changes — a const array built once at load would freeze
   its strings in whichever language was active on first paint. Numbers
   never pass through translation, so toggling language can't change a
   figure, only how it's labelled. */
function buildDomains(){
  SRC_LU  = L("ที่มา:")+" "+L(LX2567.landuse.sourceTH)+" · "+L("ข้อมูลจริง ปี")+" "+L(YR);

  /* ── LAND USE — 5 level-1 classes, real m² → ไร่ ─────────────────── */
  LU_ROWS=LU2567.rows.map(c=>{
    const lead=LU_L2_LEAD[c.id];
    const sh=+c.share.toFixed(2);
    return {name:CN(c), catId:c.id, color:c.color, val:c.rai, share:sh, pct:null, lead,
      badge:bdg(L(sh>=30?"สัดส่วนหลัก":sh>=5?"สัดส่วนรอง":"สัดส่วนน้อย"),
                sh>=30?"b-up":sh>=5?"b-flat":"b-none"),
      metaL:fmt(c.rai)+" "+L("ไร่"), metaR:sh.toFixed(1)+"%"};
  });
  /* ── FOREST — LandTrendr, by year of detected change.
     2532 is excluded everywhere: it absorbs every change at or before the
     start of the record (48% of the dataset), so ranking it against real
     calendar years would be meaningless. ─────────────────────────────── */
  FR_ROWS=LT.filter(r=>r.be>=2533 && r.px>0)
    .sort((a,b)=>b.km2-a.km2).slice(0,12).map(r=>({
      name:L(YR).split(" ")[0]+" "+r.label, val:r.rai, km2:r.km2, color:r.hex,

           :r.be===2567?bdg(L("ปีล่าสุด"),"b-watch")

  FL_ROWS=FLOOD_BY_REGION.map(r=>{
    const sh=+(r.rai/LX2567.flood.footprintRai*100).toFixed(1);
    return {name:RN(r), val:r.rai, share:sh, pct:null, provs:r.provs, polys:r.polys, top:r.top,
      badge:bdg(L(sh>=40?"กระทบสูงมาก":sh>=10?"กระทบสูง":"กระทบปานกลาง"),
                sh>=40?"b-high":sh>=10?"b-med":"b-low"),

  /* ── COMMUNITY — the 7 built-up sub-classes. They sum exactly to the
     level-1 U total, so the split is complete, not a sample. ─────────── */
  CM_ROWS=LU_URBAN_L2.map((u,i)=>{
    const sh=+(u.rai/LU_URBAN_TOTAL*100).toFixed(1);
    return {name:L2N(u), val:u.rai, share:sh, pct:null, code:u.code, color:URB_RAMP[i],
      badge:bdg(L(sh>=20?"สัดส่วนหลัก":sh>=5?"สัดส่วนรอง":"สัดส่วนน้อย"),
                sh>=20?"b-up":sh>=5?"b-flat":"b-none"),
      metaL:fmt(u.rai)+" "+L("ไร่"), metaR:sh.toFixed(1)+"%"};

  _luL2Top = LU_L2_TOP[0];

  { id:"landuse", tab:L("การใช้ที่ดิน"), icon:IC("map-01"), accent:"#C07820", accentD:"#9A5E14", alert:false,

let NAV;
let currentView = "overview";   /* "overview" | domain index — used to re-render the right view after a language toggle */
let lastFloodRegionKey = null;  /* re-open the drawer in the new language if it's open when toggled */

/* ── history integration — makes the phone's hardware/gesture back
   button (and the desktop browser's back button) navigate WITHIN the
   app instead of leaving it. Without this, every view switch is just
   an innerHTML swap with no history entry, so "back" on mobile exits
   the whole page instead of returning to the previous topic/overview.
   Two levels are tracked: {view} for Overview↔Topic, and {view,drawer}
   for the flood drill-down drawer layered on top of a topic. ── */
let navigatingFromPopstate=false;
/* Some browsers (and jsdom) throw a SecurityError on pushState/replaceState
   for file:// documents with a null/opaque origin. Every history call is
   wrapped so that case just silently falls back to "no history entry" —
   the rest of the app keeps working exactly as before this feature existed,
   it just loses the back-button convenience on that one origin. */
function safeHistory(fn){ try{ fn(); }catch(e){} }
function pushView(v){
  if(navigatingFromPopstate) return;
  /* already logically on this topic — skip, whether or not a drawer is
     currently layered on top of it (re-renders from a language toggle
     call select()/showOverview() again without actually navigating) */
  if(history.state && history.state.view===v) return;
  safeHistory(()=>history.pushState({view:v}, "", location.pathname+location.search+location.hash));
}
window.addEventListener("popstate", e=>{
  navigatingFromPopstate=true;
  const st=e.state||{view:"overview"};
  const drawerEl=document.getElementById("lxDrawer");
  const wasDrawerOpen=drawerEl && drawerEl.classList.contains("open");
  if(wasDrawerOpen && !st.drawer) closeDrawer();
  if(currentView!==st.view){ if(st.view==="overview") showOverview(); else select(st.view); }
  const side=document.getElementById("lxSidebar");
  if(side && side.classList.contains("open") && !st.menu) setNavOpen(false);
  updateMobileBack();
  navigatingFromPopstate=false;
});
/* mobile-only "‹" button next to the hamburger — a visible, always-
   discoverable way back that doesn't depend on the user knowing their
   phone's back gesture will do the right thing */
function updateMobileBack(){
  const b=document.getElementById("mBackBtn");
  if(b) b.style.display = currentView==="overview" ? "none" : "flex";
}

/* ── TH/EN toggle — top filter bar, next to the year selector ──────────
   Flips LANG, rebuilds every LANG-dependent piece of state (DOMAINS via
   buildDomains(), NAV via buildNav()), then re-renders exactly what's on
   screen: the current view (overview or a tab), the persistent map/layer
   panel node, all data-th/data-en chrome, and the flood drawer if a
   region is open. No page reload, no scroll-position loss. */
const TITLE_TH="Spatial Indicator Dashboard · ข้อมูลจริง พ.ศ. 2567";
const TITLE_EN="Spatial Indicator Dashboard · Real Data, B.E. 2567";
function buildLangToggle(){
  const box=document.getElementById("langToggle");
  if(!box) return;
  box.querySelectorAll("button").forEach(b=>{
    const on=b.dataset.lang===LANG;
    b.classList.toggle("active",on);
    b.setAttribute("aria-pressed",String(on));
  });
}
function wireLangToggle(){
  const box=document.getElementById("langToggle");
  if(!box) return;
  box.querySelectorAll("button").forEach(b=>{
    b.addEventListener("click",()=>{ if(b.dataset.lang!==LANG) setLanguage(b.dataset.lang); });
  });
}
function setLanguage(lang){
  if(lang!=="en" && lang!=="th") return;
  if(lang===LANG) return;
  const drawerOpen = document.getElementById("lxDrawer")?.classList.contains("open");
  LSET(lang);
  document.documentElement.lang = LANG;
  document.title = LANG==="en" ? TITLE_EN : TITLE_TH;
  buildDomains();
  buildNav();
  buildLangToggle();
  applyStaticI18n(document);
  if(mapNode) applyStaticI18n(mapNode);
  if(currentView==="overview") showOverview(); else select(currentView);
  if(drawerOpen && lastFloodRegionKey) openFloodRegion(lastFloodRegionKey);
}

/* ── mobile navigation ────────────────────────────────────────────────
   Below 860px the sidebar is a drawer. It shares the markup and the
   click handlers with the desktop rail — only the CSS transform and
   these three listeners differ, so the two can never drift apart. */
let setNavOpen=()=>{};   /* exposed so popstate can close the menu too */
(function mobileNav(){
  const side=document.getElementById("lxSidebar");
  const btn=document.getElementById("mNavBtn");
  /* create the scrim if it is somehow missing rather than bailing out —
     a missing overlay must never cost the user the whole menu */
  let scrim=document.getElementById("navScrim");
  if(!scrim){ scrim=document.createElement("div"); scrim.id="navScrim"; document.body.appendChild(scrim); }
  if(!side||!btn) return;
  const setOpen=on=>{
    if(side.classList.contains("open")===on) return;   /* no-op, keeps history clean */
    side.classList.toggle("open",on);
    scrim.classList.toggle("open",on);
    btn.setAttribute("aria-expanded",String(on));
    /* lock background scroll only while the sheet is over the content */
    document.body.style.overflow = on ? "hidden" : "";
    if(on) side.querySelector(".navitem")?.focus?.();
    else btn.focus?.();
    /* Give the open menu its own history entry, exactly like the flood
       drawer, so the phone's back gesture dismisses the menu and nothing
       else — without this, back would close the menu AND jump the user
       to the previous tab, which reads as two actions for one gesture. */
    if(navigatingFromPopstate) return;
    if(on){
      if(!(history.state && history.state.menu))
        safeHistory(()=>history.pushState({view:currentView, menu:true}, "", location.pathname+location.search+location.hash));
    }else if(history.state && history.state.menu){
      safeHistory(()=>history.back());
    }
  };
  setNavOpen=setOpen;
  btn.addEventListener("click",()=>setOpen(!side.classList.contains("open")));
  scrim.addEventListener("click",()=>setOpen(false));
  /* picking a section is the end of the nav task — close behind it */
  side.addEventListener("click",e=>{
    if(e.target.closest("#mNavClose")){ setOpen(false); return; }
    if(e.target.closest(".navitem")) setOpen(false);
  });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape") setOpen(false); });
  /* swipe left on the open sheet to dismiss — the gesture people already
     expect from every other off-canvas menu on a phone */
  let x0=null;
  side.addEventListener("touchstart",e=>{ x0=e.touches[0].clientX; },{passive:true});
  side.addEventListener("touchend",e=>{
    if(x0===null) return;
    const dx=e.changedTouches[0].clientX-x0;
    if(dx<-45) setOpen(false);
    x0=null;
  },{passive:true});
  /* if the viewport grows back past the breakpoint, drop the drawer state */
  LXMQ("(min-width:861px)").addEventListener("change",e=>{ if(e.matches) setOpen(false); });
})();

/* mobile "‹" back button, next to the hamburger — always takes the
   user back one step via the real history stack (same mechanism the
   phone's own back gesture uses), so both stay in sync */
(function mobileBack(){
  const b=document.getElementById("mBackBtn");
  if(!b) return;
  b.addEventListener("click",()=>safeHistory(()=>history.back()));
})();

/* ── initial paint in whatever language was saved last session ── */
document.documentElement.lang = LANG;
document.title = LANG==="en" ? TITLE_EN : TITLE_TH;
applyStaticI18n(document);
buildLangToggle();
wireLangToggle();
safeHistory(()=>history.replaceState({view:"overview"}, "", location.pathname+location.search+location.hash));
showOverview();
updateMobileBack();
</script>

</body>
