<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LANDX · ภาพรวมข้อมูลพื้นที่ · การใช้ที่ดิน + น้ำท่วม พ.ศ. 2567</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.js"></script>
<style>
  /* Figma tokens: primary #fdc003 · text #171717/#474747 · success #1bb161 · warning #943c0c · danger #ef2925 */
  :root{
    --accent:#FDC003; --accent-d:#BA6903; --accent-active:#F0A800;
    --ink:#171717; --text:#474747; --muted:#525252; --hint:#A3A3A3;
    --border:#D4D4D4; --line:#EBEBEB; --panel:#F5F5F5; --bg:#FAFAF8;
    --green:#1BB161; --green-d:#14673C; --green-l:#7CB342; --green-dk:#2E7D32;
    --blue:#4F9BD6; --blue-d:#2E6FAE; --red:#EF2925; --red-d:#A41210; --warn-d:#943C0C; --tan:#C0A16B;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{font-family:"Noto Sans Thai",system-ui,-apple-system,sans-serif; color:var(--text); background:var(--bg); -webkit-font-smoothing:antialiased;}

  /* ── top bar ── */
  .topbar{height:56px; background:#fff; border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 16px; gap:6px; position:sticky; top:0; z-index:30;}
  .navico{width:40px; height:40px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--muted); cursor:pointer; transition:background .15s; font-size:17px;}
  .navico:hover{background:var(--panel); color:var(--ink);}
  .navico.disabled{opacity:.35; pointer-events:none;}
  .logo{position:absolute; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:8px; font-size:19px; font-weight:900; letter-spacing:.04em; color:var(--ink);}
  .logo .mk{width:22px; height:22px; border-radius:5px; background:linear-gradient(145deg,#FDC003,#F0A800); position:relative;}
  .logo .mk::after{content:""; position:absolute; inset:5px 5px auto auto; width:7px; height:7px; background:#fff; border-radius:2px;}
  .logo .x{color:var(--accent);}
  .avatar{margin-left:12px; width:40px; height:40px; border-radius:50%; background:linear-gradient(145deg,#5b6b7a,#33414d); border:2px solid #fff; box-shadow:0 0 0 1px var(--border); display:flex; align-items:center; justify-content:center; color:#fff; font-size:15px;}

  /* ── filter bar ── */
  .filterbar{background:#fff; border-bottom:1px solid var(--border); padding:15px 16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; position:sticky; top:56px; z-index:20; min-height:64px;}
  .fb-label{font-size:14px; font-weight:700; color:var(--ink); margin-right:6px;}
  .fb-right{margin-left:auto; display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .toggle-wrap{display:flex; align-items:center; gap:9px; font-size:13px; color:var(--text); font-weight:600;}
  .toggle{width:36px; height:18px; border-radius:12px; background:var(--accent); position:relative; cursor:pointer; transition:background .2s; flex-shrink:0;}
  .toggle::after{content:""; position:absolute; top:2px; left:20px; width:14px; height:14px; border-radius:50%; background:#fff; transition:left .2s; box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .toggle.off{background:#CFCFCF;} .toggle.off::after{left:2px;}
  .dd{min-width:170px; height:32px; border:1px solid var(--border); border-radius:8px; display:flex; align-items:center; gap:8px; padding:0 11px; color:var(--hint); font-size:13px; background:#fff; cursor:not-allowed;}
  .dd .pin{color:var(--hint);} .dd .cv{margin-left:auto; color:var(--hint); font-size:10px;}
  .divider{width:1px; height:22px; background:var(--border);}
  /* scope pill + year stepper — Figma node 489:9722 */
  .scope-pill{height:32px; border:1px solid var(--border); border-radius:6px; background:#fff;
    display:inline-flex; align-items:center; gap:8px; padding:0 10px; cursor:pointer;
    font-family:inherit; font-size:14px; font-weight:400; color:var(--text); white-space:nowrap;
    box-shadow:0 1px 4px rgba(12,13,13,.06); transition:background .15s;}
  .scope-pill:hover{background:var(--panel);}
  .scope-pill .cv{margin-left:2px; color:var(--muted);}
  .yearsel{display:flex; align-items:center; gap:4px;}
  .yr-btn{width:28px; height:28px; border-radius:6px; border:none; background:transparent;
    color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;
    transition:background .15s;}
  .yr-btn:hover:not(:disabled){background:var(--panel); color:var(--ink);}
  .yr-btn:disabled{opacity:.3; cursor:default;}
  .yr-box{height:32px; min-width:73px; border:1px solid var(--border); border-radius:6px; background:#fff;
    display:flex; align-items:center; justify-content:center; padding:0 12px; cursor:pointer;
    font-family:inherit; font-size:14px; font-weight:400; color:var(--text);
    box-shadow:0 1px 4px rgba(12,13,13,.06); transition:background .15s;}
  .yr-box:hover{background:var(--panel);}
  /* TH / EN language switch — segmented control in the top bar */
  .langsw{display:inline-flex; align-items:center; border:1px solid var(--border); border-radius:6px;
    background:#fff; overflow:hidden; height:32px; margin-left:auto;}
  .langsw button{border:none; background:transparent; font-family:inherit; font-size:12.5px; font-weight:600;
    color:var(--muted); padding:0 11px; height:100%; cursor:pointer; transition:background .15s,color .15s;}
  .langsw button+button{border-left:1px solid var(--border);}
  .langsw button[aria-pressed="true"]{background:#FFF6D6; color:var(--accent-d);}
  .langsw button:hover:not([aria-pressed="true"]){background:var(--panel); color:var(--ink);}

  /* ── page ── */
  .wrap{max-width:1280px; margin:0 auto; padding:16px 16px 32px;}
  .page-h{font-size:16px; font-weight:700; color:var(--ink); margin-bottom:12px; display:flex; align-items:center; gap:9px;}
  .page-h .pico{color:var(--accent-d); font-size:17px;}


  /* Badge — Figma "Badge/Tag": outlined white pill + status dot + neutral text */
  .badge2{display:inline-flex; align-items:center; gap:6px; font-family:inherit; font-size:12px; font-weight:400; padding:4px 8px; border-radius:999px; border:1px solid #D4D4D4; background:#fff; color:#474747; white-space:nowrap; line-height:1.4;}
  .badge2 i{width:8px;height:8px;border-radius:50%; flex-shrink:0;}

  /* Insight box — Figma Background/Warning/Light on Border/Primary tint */
  .insight{background:#FFFBEB; border:1px solid #F5E3B3; border-radius:8px; padding:10px 12px; margin-top:12px;}
  .insight .ih{font-size:12px; font-weight:600; color:var(--accent-d); margin-bottom:4px;}
  .insight .it{font-size:12px; color:var(--text); line-height:1.45;}

  /* info tooltip */
  .info{position:relative; display:inline-flex; cursor:help; color:var(--hint); font-size:13px; user-select:none;}
  .info .tip{display:none; position:absolute; top:22px; right:0; width:250px; background:#262626; color:#fff; font-size:11px; font-weight:500; line-height:1.65; padding:10px 12px; border-radius:9px; box-shadow:0 12px 30px -8px rgba(0,0,0,.5); z-index:60; text-align:left;}
  .info:hover .tip, .info.open .tip{display:block;}
  .info .tip b{color:#FFD98A;}
  .info .tip::before{content:""; position:absolute; top:-5px; right:9px; width:10px; height:10px; background:#262626; transform:rotate(45deg);}

  .srcfoot{font-size:9.5px; color:var(--hint); margin-top:10px; padding-top:7px; border-top:1px dashed var(--line); line-height:1.4;}

  /* ── cards grid (overview) — Figma "Landuse - 18", node 488:9120 ──
     Each domain owns a tint that washes from the header down into white,
     so the four cards read as one family without needing heavy borders. */
  .cards{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; align-items:stretch;}
  .card{background:#fff; border:1px solid var(--border); border-radius:8px; overflow:hidden;
    display:flex; flex-direction:column; box-shadow:0 1px 4px rgba(12,13,13,.10); position:relative;}
  /* the wash is a pseudo-element so it never tints the content above it */
  .card::before{content:""; position:absolute; inset:0 0 auto 0; height:58%; pointer-events:none;
    background:linear-gradient(180deg, var(--card-tint) 0%, rgba(255,255,255,0) 100%);}
  .card>*{position:relative;}
  .card.c-landuse  {--card-tint:#FFFEEA; --card-ico:#BA6903; --card-icobg:#FFF6D6;}
  .card.c-forest   {--card-tint:#ECFEF4; --card-ico:#14673C; --card-icobg:#CEF8E1;}
  .card.c-flood    {--card-tint:#FEECEB; --card-ico:#A41210; --card-icobg:#FDC9C8;}
  .card.c-community{--card-tint:#EBF5FF; --card-ico:#024E8A; --card-icobg:#B8E0FF;}
  .card .ch{display:flex; align-items:flex-start; gap:12px; padding:16px 16px 0;}
  /* title sits under the icon+badge row in the Figma frame, so the header wraps —
     .chwrap is the live markup; the topic name (.ct) is the card's main identifier,
     so it carries the strongest weight/size/contrast on the card to anchor hierarchy
     before the reader gets to metrics. Bumped up from the previous 14.5px/700 (which
     had also been rendering unstyled due to a stale selector) for clearer prominence. */
  .card .chwrap{display:flex; flex-direction:column; gap:14px; padding:16px 16px 12px;}
  .card .chwrap .chtop{display:flex; align-items:center; gap:9px;}
  /* each card owns a tint (--card-ico, set alongside --card-tint above), so
     the header icon reads as part of that card's colour family instead of
     one fixed accent for all four                                        */
  .card .chwrap .chtop .ci{color:var(--card-ico); font-size:19px; flex-shrink:0;}
  .card .chwrap .chtop .badge2{margin-left:auto;}
  .card .chwrap .ct{font-size:18px; font-weight:800; color:var(--ink); line-height:1.25;
    letter-spacing:-.01em;}
  .card .cb{padding:0 16px 16px; flex:1; display:flex; flex-direction:column;}
  .hr{height:1px; background:var(--line); margin:0 16px;}
  /* metric block — typography reverted to the previous set; the flex/mtxt
     wrapper stays so the (now icon-less) rows still line up cleanly    */
  .metric{padding:12px 0 4px; display:flex; gap:12px; align-items:flex-start;}
  /* .metric only appears inside the 4 overview cards, so this quietly groups
     each card's stat blocks (e.g. total forest change | long-term trend) —
     same hairline tone as the .hr under the card header, kept thin and
     unobtrusive so it aids scanning without adding visual weight.        */
  .metric+.metric{border-top:1px solid var(--line); padding-top:14px;}
  .metric .mtxt{flex:1; min-width:0;}
  .metric .ml{font-size:12.5px; color:var(--muted); display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .metric .ml .mi{font-size:18px;}
  .metric .mv{font-size:23px; font-weight:700; color:var(--ink); line-height:1.15; margin-top:3px;
    display:flex; align-items:baseline; gap:6px; flex-wrap:wrap;}
  .metric .mv small{font-size:14px; font-weight:700; color:var(--muted);}
  .metric .mv .trend{font-size:15px; font-weight:700;}
  .metric .up{color:var(--green); font-weight:800; font-size:16px;}
  .metric .mvsub{font-size:12px; color:var(--hint); margin-top:2px;}
  /* base rule — still used by drill-down panel sub-headings; the home
     page overrides it below via .cards .sub-h                         */
  .sub-h{font-size:14px; font-weight:400; color:var(--text); margin:14px 0 8px;}
  .lrow{display:flex; align-items:center; gap:10px; padding:5px 0; font-size:13px;}
  .lrow .li{width:26px;height:26px;border-radius:7px;background:var(--panel);
    color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
  .lrow .ln{color:var(--text); font-weight:600;}
  .lrow .lv{margin-left:auto; color:var(--muted); font-weight:700; font-size:12.5px;}
  .more{margin-top:14px; text-align:right;}
  /* sub-h and insight are shared with the drill-down panels, which keep
     the current type; only the home-page cards revert                 */
  .cards .sub-h{font-size:12.5px; font-weight:700; margin:10px 0 8px;}
  .cards .insight .ih{font-size:11px; font-weight:800; letter-spacing:.02em; margin-bottom:3px;}
  .cards .insight .it{font-size:12px; color:var(--muted); line-height:1.6;}
  /* Insight docks to the bottom of the card, flush above the "more" button,
     regardless of how much content sits above it — content length differs
     per card (some have a sub-h + ranked list, some don't), so without this
     the box would land at a different height on every card. The cards grid
     already stretches all four to equal height, so pinning insight with
     margin-top:auto puts it at the same Y position on every one.        */
  .cards .insight{margin-top:auto;}
  .more button{border:1px solid #F0A800; background:#fff; color:#BA6903; font-family:inherit; font-size:14px; font-weight:400; padding:8px 12px; border-radius:6px; cursor:pointer; display:inline-flex; align-items:center; gap:8px; transition:background .15s;}
  .more button:hover{background:#FFF7DB;}
  .segbar{height:12px; border-radius:999px; overflow:hidden; display:flex; margin:10px 0 12px;}
  .segbar>div{height:100%;}
  .kv{display:flex; align-items:center; gap:8px; font-size:13px; padding:4px 0;}
  .kv .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  /* EN labels (e.g. "Human activity area") run longer than the TH originals,
     so without min-width:0 the label and the value fight over space and both
     wrap — "18,927,299" / "rai" landing on separate lines. Letting only .kn
     shrink/wrap, while .kvv and .kp stay nowrap, keeps the number/unit and
     the percentage intact on one line in either language.                */
  .kv .kn{color:var(--text); flex:1; min-width:0;}
  .kv .kvv{margin-left:auto; font-weight:800; color:var(--ink); white-space:nowrap; flex-shrink:0;}
  .kv .kp{color:var(--muted); font-weight:700; width:42px; text-align:right; flex-shrink:0;}

  /* drill-down: content LEFT, map RIGHT */
  .dd-layout{display:flex; gap:16px; align-items:stretch;}
  .leftcol{flex:1; display:flex; flex-direction:column; gap:16px; min-width:0;}
  .mapcol{flex:0 0 40%; min-width:380px;}
  .toprow{display:flex; gap:16px; align-items:stretch;}
  .toprow>.panel{flex:1; min-width:0;}
  /* a column of stacked panels that behaves like one flex child, so a tall
     panel next to it sets the height and neither side ends in dead space */
  .stackcol{flex:1; min-width:0; display:flex; flex-direction:column; gap:16px;}
  .stackcol>.panel{flex:1;}
  .pcont{flex:1; min-height:0;}
  .panel{background:#fff; border:1px solid var(--border); border-radius:12px; display:flex; flex-direction:column;}
  .panel .ph{display:flex; align-items:center; gap:8px; padding:13px 16px; border-bottom:1px solid var(--line); font-size:14px; font-weight:700; color:var(--ink); justify-content:space-between;}
  .panel .ph .pt{display:inline-flex; align-items:center; gap:7px;}
  .panel .pbody{padding:14px 16px; display:flex; flex-direction:column; flex:1;}
  .trendbody{display:flex; gap:16px;}
  .trendbody .cw{flex:2; min-width:0;}
  .trendbody .ic{flex:1; min-width:210px; display:flex;}
  .trendbody .ic .insight{margin-top:0; width:100%;}

  /* map */
  .mapwrap{position:relative; height:100%; min-height:600px; border-radius:12px; overflow:hidden; border:1px solid var(--border); background:#EAE6DC;}
  #lxmap{position:absolute; inset:0;}
  /* maplibre-gl.css ships its own font stack (Helvetica Neue/Arial) on
     .maplibregl-map, which silently overrides the page font for every
     DOM-rendered map element — attribution, controls, default popups.
     None of that stack has Thai coverage, so it was falling back to
     whatever generic sans the OS ships. Force it back to the same
     Noto Sans family the canvas labels use, so map chrome and map
     labels read as one typographic system instead of two.            */
  #lxmap.maplibregl-map{font-family:"Noto Sans Thai", system-ui, -apple-system, sans-serif;}
  .mapwrap .maplibregl-ctrl-attrib{font-size:8px; background:rgba(255,255,255,.6);}

  /* ── Layer panel — matches Figma "Layer panel - Overall Page" (node 333:12237), same as land-intelligence-dashboard.html / spatial-indicator-dashboard.html ── */
  .lp-panel{
    position:absolute; top:14px; right:14px; z-index:5; width:296px;
    background:#fff; border-radius:8px; padding:8px; display:flex; flex-direction:column; gap:8px;
    box-shadow:0 12px 26px -14px rgba(0,0,0,.3); max-height:calc(100% - 28px); overflow:hidden;
  }
  .lp-header{display:flex; align-items:center; gap:4px; padding-left:8px; flex-shrink:0;}
  .lp-header p{flex:1; font-size:14px; color:#171717;}
  .lp-iconbtn{display:flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:6px; border:none; background:transparent; cursor:pointer; color:#171717; flex-shrink:0; font-size:14px;}
  .lp-iconbtn:hover{background:#F5F5F5;}
  .lp-body{flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column;}

  .lp-layer{padding:0 0 10px 12px; display:flex; flex-direction:column; gap:8px; border-bottom:1px solid var(--border); flex-shrink:0;}
  .lp-layer:last-child{border-bottom:none; padding-bottom:2px;}
  .lp-layer-head{display:flex; align-items:center; gap:8px; height:28px; padding-right:8px;}
  .lp-layer-head .nm{flex:1; font-size:14px; font-weight:600; color:#171717; line-height:1;}

  .lp-toggle{position:relative; width:36px; height:18px; flex-shrink:0; display:inline-block;}
  .lp-toggle input{position:absolute; inset:0; opacity:0; margin:0; cursor:pointer; z-index:1;}
  .lp-toggle .track{position:absolute; inset:0; border-radius:9999px; background:#E3E3E3; transition:background .15s;}
  .lp-toggle .knob{position:absolute; top:3px; left:3px; width:12px; height:12px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.25); transition:left .15s;}
  .lp-toggle input:checked ~ .track{background:#FDC003;}
  .lp-toggle input:checked ~ .knob{left:21px;}

  .lp-caption{font-size:12px; color:#171717; padding-right:12px;}
  .lp-swatchrow{display:flex; align-items:center; gap:8px; padding-right:12px;}
  .lp-swatch{width:12px; height:12px; border-radius:2px; flex-shrink:0;}
  .lp-swatchrow span:last-child{font-size:12px; color:#525252;}

  .lp-slider-field{display:flex; flex-direction:column; gap:12px; padding:6px 12px 0 0;}
  .lp-slider-label{display:flex; justify-content:space-between; font-size:12px; color:#171717;}
  .lp-slider-label .out{color:#1e1e1e; text-align:right;}
  .lp-slider{-webkit-appearance:none; appearance:none; width:100%; height:16px; background:transparent; outline:none; cursor:pointer; margin:0;}
  .lp-slider::-webkit-slider-runnable-track{height:8px; border-radius:9999px; background:#F5F5F5;}
  .lp-slider::-webkit-slider-thumb{-webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:#242424; border:1px solid #757575; margin-top:-4px; box-shadow:0 1px 4px rgba(12,13,13,.15);}
  .lp-slider::-moz-range-track{height:8px; border-radius:9999px; background:#F5F5F5;}
  .lp-slider::-moz-range-progress{height:8px; border-radius:9999px; background:#E3E3E3;}
  .lp-slider::-moz-range-thumb{width:16px; height:16px; border-radius:50%; background:#242424; border:1px solid #757575; box-shadow:0 1px 4px rgba(12,13,13,.15);}

  .lp-reopen{
    position:absolute; top:14px; right:14px; z-index:5; display:none; align-items:center; gap:6px;
    background:#fff; border:1px solid var(--border); border-radius:9999px; padding:8px 14px 8px 12px;
    font-size:12.5px; font-weight:700; color:var(--ink); cursor:pointer; box-shadow:0 8px 20px -10px rgba(0,0,0,.35);
  }

  /* charts */
  .legend{display:flex; flex-direction:column; gap:8px;}
  .lgrow{display:flex; align-items:center; gap:9px; font-size:12.5px;}
  .lgrow .sw{width:11px;height:11px;border-radius:3px;flex-shrink:0;}
  .lgrow .nm{color:var(--text); flex:1;} .lgrow b{font-weight:800; color:var(--ink);} .lgrow .pc{color:var(--hint); width:52px; text-align:right; font-size:11.5px;}
  .change{display:flex; gap:12px; padding:11px 0; border-bottom:1px solid var(--line);}
  .change:last-of-type{border-bottom:none;}
  .change .cig{width:38px;height:38px;border-radius:10px;background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
  .change .pct{font-size:18px; font-weight:800; color:var(--green); display:flex; align-items:center; gap:4px;}
  .change .who{font-size:12.5px; font-weight:700; color:var(--ink); margin-top:1px;}
  .fromcol{flex:1; min-width:0; text-align:right;}
  .fromcol .fh{font-size:11px; color:var(--hint);}
  .fromcol .fr{font-size:11.5px; color:var(--muted); margin-top:3px; display:flex; align-items:center; justify-content:flex-end; gap:5px;}
  .fromcol .fr b{color:var(--text);}
  .hbars{display:flex; flex-direction:column; gap:8px; min-width:0;}
  .hbar{display:flex; align-items:center; gap:9px; min-width:0;}
  .hbar .hl{width:120px; font-size:12px; color:var(--text); text-align:right; flex-shrink:0;}
  .hbar .ht{flex:1; min-width:0; height:16px; background:var(--panel); border-radius:5px; overflow:hidden;}
  .hbar .hf{height:100%; border-radius:5px;}
  /* value column stacks the number above the badge instead of running
     them inline — a fixed single-line width was clipping/overflowing
     wherever a badge was present (e.g. "ผลกระทบตามประเภทการใช้ที่ดิน") */
  .hbar .hv{width:auto; min-width:58px; flex-shrink:0;
    display:flex; flex-direction:column; align-items:flex-end; gap:2px;
    text-align:right; font-size:12px; font-weight:700; line-height:1.3;}
  .badge{font-size:10.5px; font-weight:700; padding:2px 9px; border-radius:10px; margin-left:6px; white-space:nowrap;}
  .hbar .hv .badge{margin-left:0;}
  .b-high{background:#FFEBEB;color:#A41210;} .b-med{background:#FFFBEB;color:#943C0C;} .b-low{background:#ECFEF4;color:#14673C;}
  .tiles{display:flex; gap:10px; margin-top:12px;}
  .tile{flex:1; background:var(--panel); border-radius:10px; padding:12px 8px; text-align:center;}
  .tile .e{font-size:22px;} .tile .n{font-size:19px; font-weight:900; margin-top:3px; color:var(--ink);} .tile .l{font-size:11px; color:var(--muted); margin-top:1px;}
  .axis{font-size:9px; fill:var(--hint); font-family:inherit;}
  .tl{display:flex; gap:16px; margin-top:8px; font-size:11.5px; color:var(--muted); flex-wrap:wrap;}
  .tl span{display:flex; align-items:center; gap:5px;} .tl .sw{width:10px;height:10px;border-radius:3px;}

  /* ══ RESPONSIVE ══════════════════════════════════════════════════ */

  /* tablet / small laptop — two cards per row, map drops below content */
  @media(max-width:1200px){
    .cards{grid-template-columns:repeat(2,1fr);}
    .dd-layout{flex-direction:column;}
    .mapcol{flex:none; min-width:0;}
    .mapwrap{min-height:420px;}
    .trendbody{flex-direction:column;}
  }

  /* ── tablet portrait ── */
  @media(max-width:900px){
    .wrap{padding:14px 12px 28px;}
    .toprow{flex-direction:column;}
    /* once the row stacks there is nothing to match heights against, so
       let every panel fall back to its natural height                   */
    .stackcol>.panel{flex:none;}
    .filterbar{padding:11px 12px; gap:10px; min-height:0;}
    .fb-right{margin-left:0; width:100%; gap:10px;}
    .hbar .hl{width:92px; font-size:11.5px;}
    .hbar .hv{min-width:56px; font-size:11.5px;}
  }

  /* ── phone ──────────────────────────────────────────────────────
     The top bar and filter bar are both sticky; on a phone that ate
     most of the first screen, so the filter bar scrolls away and only
     the 56px top bar stays pinned.                                   */
  @media(max-width:640px){
    body{-webkit-text-size-adjust:100%;}
    .wrap{padding:12px 10px 24px;}
    .cards{grid-template-columns:1fr; gap:12px;}

    .topbar{padding:0 6px; gap:0;}
    .navico{width:36px; height:36px; font-size:16px;}
    .navico .ic{width:17px; height:17px;}
    .logo svg{height:20px;}
    .avatar{width:34px; height:34px; font-size:13px; margin-left:8px;}
    .avatar .ic{width:16px; height:16px;}
    /* the language switch stays visible on phones — it is the one control
       a non-Thai reader needs before anything else on the page          */
    .langsw{height:28px;}
    .langsw button{padding:0 9px; font-size:12px;}
    .scope-pill{font-size:13px; padding:0 9px;}

    .filterbar{position:static; padding:10px 10px; gap:8px; align-items:flex-start;}
    .fb-label{font-size:13px; margin-right:0;}
    .fb-right{flex-direction:row; flex-wrap:wrap; gap:10px; align-items:center;}
    .divider{display:none;}
    .yearsel{margin-left:auto;}

    .page-h{font-size:15px; margin-bottom:10px;}
    .page-h .pico .ic{width:16px; height:16px;}

    .card .ch,.card .chwrap{padding:13px 13px 10px;} .card .cb{padding:0 13px 13px;} .hr{margin:0 13px;}
    .card .chwrap .ct{font-size:16px;}
    .metric .mv{font-size:20px;} .metric .mv small{font-size:13px;}
    .metric .mvsub{font-size:11.5px;}

    .panel .ph{padding:11px 13px; font-size:13.5px; flex-wrap:wrap; gap:6px;}
    .panel .pbody{padding:12px 13px;}

    /* charts keep their aspect ratio via viewBox; give them room */
    .trendbody .ic{min-width:0;}
    .hbar{gap:7px;}
    .hbar .hl{width:78px; font-size:11px; line-height:1.25;}
    .hbar .hv{min-width:48px; font-size:11px;}
    .hbar .hv .badge{font-size:9.5px; padding:1px 7px;}
    .hbar .ht{height:14px;}
    .lgrow{font-size:12px;} .lgrow .pc{width:44px; font-size:11px;}
    .tiles{gap:8px;} .tile{padding:10px 6px;}
    .tile .e{font-size:18px;} .tile .n{font-size:17px;} .tile .l{font-size:10px;}
    .change{gap:10px;} .change .cig{width:32px;height:32px;font-size:16px;} .change .cig .ic{width:16px;height:16px;} .change .pct .ic{width:14px;height:14px;}
    .change .pct{font-size:16px;} .fromcol .fr{font-size:11px;}
    .kv{font-size:12.5px;} .kv .kp{width:38px;}

    /* map — shorter, and the layer panel becomes a bottom sheet so it
       never covers the map it is describing                            */
    .mapwrap{min-height:0; height:60vh; max-height:460px;}
    .lp-panel{
      position:absolute; top:auto; bottom:0; left:0; right:0; width:auto;
      max-height:52%; border-radius:12px 12px 0 0; padding:8px 10px 10px;
      box-shadow:0 -10px 26px -14px rgba(0,0,0,.35);
    }
    .lp-reopen{top:auto; bottom:12px; right:12px;}
    .maplibregl-ctrl-top-left{transform:scale(.9); transform-origin:top left;}
  }

  /* ── very small phones ── */
  @media(max-width:380px){
    .hbar .hl{width:66px; font-size:10.5px;}
    .hbar .hv{min-width:42px; font-size:10.5px;}
    .hbar .hv .badge{font-size:9px; padding:1px 6px;}
    .metric .mv{font-size:18px;}
    .lgrow{font-size:11.5px;}
    .card .chwrap .ct{font-size:15px;}
  }

  /* touch devices have no hover — make sure nothing depends on it */
  @media(hover:none){
    .hv:hover{opacity:1;}
  }

  /* ── icon sprite instances — Untitled UI stroke icons via <use> ──
     Replaces the emoji/glyphs that used to sit in these spots. Sizing is
     tuned per context to match the visual weight of what it replaces;
     colour always comes from currentColor, so accent tints (card header,
     badge dots, hex-coded metric colours) carry over automatically.    */
  .ic{display:inline-block; vertical-align:middle; flex-shrink:0;}
  .navico .ic{width:19px; height:19px;}
  .avatar .ic{width:18px; height:18px;}
  .info .ic{width:14px; height:14px;}
  .page-h .pico .ic{width:18px; height:18px;}
  .card .chwrap .chtop .ci .ic{width:20px; height:20px;}
  .metric .ml .mi .ic{width:16px; height:16px;}
  .metric .mv .trend .ic{width:14px; height:14px;}
  .lrow .li .ic{width:15px; height:15px;}
  .change .cig .ic{width:19px; height:19px;}
  .change .pct .ic{width:16px; height:16px;}
  .fromcol .fr .ic{width:12px; height:12px;}
  button .ic{width:16px; height:16px;}
  /* inline warning marker ahead of tooltip/panel disclaimer text */
  .note{display:inline-flex; align-items:center;}
  .note .ic{width:11px; height:11px; vertical-align:-1px; margin-right:3px; flex-shrink:0;}
</style>

  /* ── LANDX shared map tooltip (hover) ── */

  .tt-sev{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;margin-left:auto;}

     to the middle of the wrapped text, and the second sentence sat on its own
     flush-left row with no icon, reading as an unrelated line. One block now —
     icon pinned to the first line, the whole caveat as a single indented
     paragraph, tinted so it reads as an aside rather than another data row. */

<script>
/* ══════════════════════════════════════════════════════════════════
   LANDX shared mock dataset  ·  generated from landx-dataset.json
   Single source of truth for every chart, map layer and tooltip.
   ══════════════════════════════════════════════════════════════════ */
const LANDX   = JSON.parse(document.getElementById("landx-data").textContent);
const LX_PROV = Object.fromEntries(LANDX.provinces.map(p=>[p.provinceId,p]));
const LX_REG  = Object.fromEntries(LANDX.regions.map(r=>[r.regionId,r]));
const LX_CAT  = Object.fromEntries(LANDX.landUseCategories.map(c=>[c.id,c]));
const LX_SEV  = Object.fromEntries(LANDX.severityLevels.map(s=>[s.id,s]));
const rai = n => Number(n).toLocaleString("en-US")+" ไร่";
const pct = n => Number(n).toFixed(2)+"%";

/* ── canonical layer geometry (identical across all LANDX prototypes) ── */
function generateLanduseGrid(){      return LANDX.layers.landuse; }
function generateFloodArea(){        return LANDX.layers.flood; }
function generateForestChangeGrid(){ return LANDX.layers.forestChange; }

/* ── canonical layer paint (identical across all LANDX prototypes) ── */
const LX_PAINT = {
  landuseFill:{ "fill-color":["match",["get","category"],
      "agri","#6fd195","forest","#1bb161","urban","#fdc003",
      "misc","#ffae4c","water","#1cb3f4","#cccccc"], "fill-opacity":0.55 },
  landuseLine:{ "line-color":"#ffffff","line-width":0.6,"line-opacity":0.5 },
  floodFill:{   "fill-color":"#2E6FAE","fill-opacity":0.55 },
  floodLine:{   "line-color":"#1f4f80","line-width":1.2 },
  forestFill:{  "fill-color":["match",["get","change"],"loss","#D04030","gain","#2F8E6A","#cccccc"],
                "fill-opacity":0.85 }
};
const LX_VIEW = { center:[100.99,13.60], zoom:5.05 };

function fmtMonthPeak(arr){
  const i=arr.indexOf(Math.max(...arr));
  return LANDX.meta.monthsTH[i]+" ("+rai(arr[i])+")";
}
function provinceTooltipHTML(pid, layer){
  const p=LX_PROV[pid], r=LX_REG[p.regionId], f=p.forestChange2568;
  const sev=LX_SEV[p.severity];
  const rows=[];
  if(layer==="landuse"){
    LANDX.landUseCategories.forEach(c=>rows.push(
      `<div class="tt-r"><span class="tt-sw" style="background:${c.color}"></span>${c.nameTH}
        <b>${rai(p.landUse[c.id])}</b><i>${pct(p.landUseShare[c.id])}</i></div>`));
  }else if(layer==="flood"){
    rows.push(`<div class="tt-r">พื้นที่น้ำท่วม 2568<b>${rai(p.flood2568Rai)}</b><i>${pct(p.floodShareOfAreaPct)}</i></div>`);
    rows.push(`<div class="tt-r">เดือนพีค<b>${fmtMonthPeak(p.floodByMonth2568Rai)}</b></div>`);
    rows.push(`<div class="tt-r">อันดับในภาค<b>${floodRankInRegion(pid)} / ${r.provinceIds.length}</b></div>`);
  }else{
    rows.push(`<div class="tt-r"><span class="tt-sw" style="background:#D04030"></span>สูญเสีย<b>${rai(f.loss)}</b></div>`);
    rows.push(`<div class="tt-r"><span class="tt-sw" style="background:#2F8E6A"></span>ฟื้นตัว<b>${rai(f.gain)}</b></div>`);
    rows.push(`<div class="tt-r">สมดุลสุทธิ<b style="color:${f.net<0?'#A41210':'#14673C'}">${f.net>0?'+':''}${rai(f.net)}</b></div>`);
  }
  return `<div class="tt">
    <div class="tt-h">${p.nameTH}<small>${p.nameEN} · ${r.nameTH}</small>
      <span class="tt-sev" style="background:${sev.color}20;color:${sev.color}">${sev.nameTH}</span></div>
    <div class="tt-b">${rows.join("")}</div>
    <div class="tt-f">พื้นที่รวม ${rai(p.areaRai)}${typeof openProvinceDetail==="function"?" · คลิกเพื่อดูรายละเอียด":""}</div>
  </div>`;
}
function floodRankInRegion(pid){
  const r=LX_REG[LX_PROV[pid].regionId];
  const sorted=r.provinceIds.map(x=>LX_PROV[x]).sort((a,b)=>b.flood2568Rai-a.flood2568Rai);
  return sorted.findIndex(x=>x.provinceId===pid)+1;
}


/* ── hover popups + click drill-down, attachable to any map instance ── */
function lxAttachMapInteractions(map){
  const HIT={ "landuse-fill":"landuse", "flood-fill":"flood" };
  let popup=null, hover=null;
  /* only bind to layers that actually exist — the land-use and flood mock
     layers are replaced by real GISTDA vector tiles in this build         */
  Object.keys(HIT).filter(id=>map.getLayer(id)).forEach(layerId=>{
    map.on("mousemove", layerId, e=>{
      if(!e.features||!e.features.length) return;
      map.getCanvas().style.cursor="pointer";
      const pid=e.features[0].properties.provinceId;
      if(hover===pid+layerId){ if(popup) popup.setLngLat(e.lngLat); return; }
      hover=pid+layerId;
      if(popup) popup.remove();
      popup=new maplibregl.Popup({closeButton:false,closeOnClick:false,maxWidth:"320px",offset:12})
        .setLngLat(e.lngLat).setHTML(tx(provinceTooltipHTML(pid,HIT[layerId]))).addTo(map);
    });
    map.on("mouseleave", layerId, ()=>{
      map.getCanvas().style.cursor=""; hover=null;
      if(popup){ popup.remove(); popup=null; }
    });
    map.on("click", layerId, e=>{
      if(!e.features||!e.features.length) return;
      if(typeof openProvinceDetail==="function") openProvinceDetail(e.features[0].properties.provinceId);
    });
  });
}
</script>

  svg .hv:hover, .segbar > .hv:hover, .hbar.hv:hover{opacity:.74;}

<script>
/* ══════════ shared chart tooltip engine + derived aggregates ══════════ */
const YR        = "พ.ศ. " + LANDX.meta.reportingYearBE;
const YR_PREV   = "พ.ศ. " + (LANDX.meta.reportingYearBE - 1);
const LX_YEARS  = LANDX.meta.years;
const LX_MONTHS = LANDX.meta.monthsTH;
const MOCKNOTE  = ""; /* provenance footer dropped by request — TIP() ignores foot anyway, kept as a no-op so existing call sites stay valid */
const N_        = LANDX.national;
const REGS_     = LANDX.regions;
const CATS_     = LANDX.landUseCategories;
const LXF       = n => Number(Math.round(n)).toLocaleString("en-US");
const LXM       = n => (n/1e6).toFixed(2);
const LXK       = n => Math.round(n/1e3).toLocaleString("en-US");
/* year-over-year % between the last two reporting years of a trend object */
function lxYoY(o){ const a=o[LX_YEARS[3]], b=o[LX_YEARS[4]]; return a? (b-a)/a*100 : 0; }
function lxShare(part,total){ return total? (part/total*100) : 0; }
function lxTopProvince(regionId, key){
  const ids = LX_REG[regionId].provinceIds.map(p=>LX_PROV[p]);
  const val = p => key==="flood" ? p.flood2568Rai
              : key==="forest" ? p.forestChange2568.change
              : key==="urban"  ? p.landUse.urban
              : p.areaRai;
  return ids.slice().sort((a,b)=>val(b)-val(a))[0];
}
function lxPeakMonth(arr){ const i=arr.indexOf(Math.max(...arr)); return {i, name:LX_MONTHS[i], v:arr[i]}; }

function tipEsc(x){ return String(x).replace(/&/g,"&amp;").replace(/"/g,"&quot;"); }
function TIP(o){
  const rows=(o.rows||[]).map(r=>
    `<div class="ct-r">${r.sw?`<span class="tt-sw" style="background:${r.sw}"></span>`:""}`+
    `<span>${r.l}</span><b${r.c?` style="color:${r.c}"`:""}>${r.v}</b></div>`).join("");
  /* provenance footer removed — tooltips now carry values only */
  const html=`<div class="ct-h">${o.t}${o.sub?`<small>${o.sub}</small>`:""}</div>`+
             (rows?`<div class="ct-b">${rows}</div>`:"");
  return ` data-tip="${tipEsc(html)}"`;
}
(function(){
  let el=null;
  function box(){
    if(el && document.body.contains(el)) return el;
    el=document.getElementById("lxTip");
    if(!el){ el=document.createElement("div"); el.id="lxTip"; document.body.appendChild(el); }
    return el;
  }
  /* ── tooltips fire on chart marks only ──────────────────────────────
     A data point inside a chart has no other way to reveal its value,
     so it keeps its tooltip. Cards, metric rows, legends and tables
     already print their numbers on screen, so hovering them showed a
     panel that mostly repeated what was visible. Those are ignored
     here rather than stripped from the markup, so the data stays
     available if a chart ever needs it.                               */
  const CHART_TIP = "svg [data-tip], .segbar > [data-tip], .hbar[data-tip]";
  function chartTarget(e){
    const t = e.target.closest && e.target.closest("[data-tip]");
    return (t && t.matches(CHART_TIP)) ? t : null;
  }
  /* place the panel near the pointer, flipping so it never leaves screen */
  function place(cx, cy){
    const b=box(), r=b.getBoundingClientRect();
    let x=cx+14, y=cy+14;
    if(x+r.width  > innerWidth -8) x=cx-r.width -14;
    if(y+r.height > innerHeight-8) y=cy-r.height-14;
    b.style.left=Math.max(6,Math.min(x, innerWidth -r.width -6))+"px";
    b.style.top =Math.max(6,Math.min(y, innerHeight-r.height-6))+"px";
  }
  function show(t, cx, cy){
    const b=box();
    b.innerHTML=t.getAttribute("data-tip");   /* already translated by render() */
    b.classList.add("on");
    place(cx, cy);          /* position immediately: touch fires no mousemove */
  }
  function hide(){ const b=box(); if(b) b.classList.remove("on"); }

  document.addEventListener("mouseover",e=>{
    const t=chartTarget(e); if(!t) return;
    show(t, e.clientX, e.clientY);
  });
  document.addEventListener("mouseout",e=>{
    if(!chartTarget(e)) return;
    hide();
  });
  document.addEventListener("mousemove",e=>{
    const b=box(); if(!b || !b.classList.contains("on")) return;
    place(e.clientX, e.clientY);
  });
  /* touch: tap a chart mark to read it, tap anywhere else to dismiss */
  document.addEventListener("touchstart",e=>{
    const touch=e.touches && e.touches[0]; if(!touch) return;
    const t=chartTarget({target:touch.target});
    if(t) show(t, touch.clientX, touch.clientY); else hide();
  },{passive:true});
  window.addEventListener("scroll", hide, {passive:true});
})();
</script>

const LU2567 = (()=>{

/* ══════════════════════════════════════════════════════════════════
   ★ Build the offline 2567 layer: exactly 67,855 features, placed
     according to the measured density grid. Deterministic — the same
     dots every reload, so screenshots and reviews stay comparable.
   ══════════════════════════════════════════════════════════════════ */
function ltMulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }
const LT_TILE2LON = (x,z)=> x/2**z*360-180;
const LT_TILE2LAT = (y,z)=>{ const n=Math.PI-2*Math.PI*y/2**z;
  return 180/Math.PI*Math.atan(0.5*(Math.exp(n)-Math.exp(-n))); };

function ltBuild2567(){
  const G=LT2567_GRID;
  /* 1 — unpack the run-length grid back to 4,500 quantised levels */
  const lv=[]; for(let i=0;i<G.rle.length;i+=2){ const v=G.rle[i], n=G.rle[i+1];
    for(let k=0;k<n;k++) lv.push(v); }
  /* 2 — levels are sqrt-scaled, so square them to recover relative density */
  const w=lv.map(L=>Math.pow(L/(G.levels-1),2));
  const wsum=w.reduce((a,b)=>a+b,0);
  /* 3 — largest-remainder split so the parts sum to EXACTLY the real total */
  const raw=w.map(v=>v/wsum*G.realPixels);
  const cnt=raw.map(Math.floor);
  let short=G.realPixels-cnt.reduce((a,b)=>a+b,0);
  const order=raw.map((v,i)=>[i,v-Math.floor(v)]).sort((a,b)=>b[1]-a[1]);
  for(let i=0;i<short;i++) cnt[order[i%order.length][0]]++;
  /* 4 — scatter each cell's share inside its own ~18 km box */
  const rnd=ltMulberry32(2567), feats=[];
  const sub=2;                                   /* sub-cells per z10 tile */
  for(let gx=0;gx<G.w;gx++) for(let gy=0;gy<G.h;gy++){
    const n=cnt[gx*G.h+gy]; if(!n) continue;
    const tx0=G.x0+gx/sub, tx1=G.x0+(gx+1)/sub;
    const ty0=G.y0+gy/sub, ty1=G.y0+(gy+1)/sub;
    const lo0=LT_TILE2LON(tx0,G.z), lo1=LT_TILE2LON(tx1,G.z);
    const la0=LT_TILE2LAT(ty0,G.z), la1=LT_TILE2LAT(ty1,G.z);
    for(let k=0;k<n;k++){
      feats.push({type:"Feature",properties:{},geometry:{type:"Point",
        coordinates:[ lo0+(lo1-lo0)*rnd(), la0+(la1-la0)*rnd() ]}});
    }
  }
  return {fc:{type:"FeatureCollection",features:feats}, count:feats.length,
          cellsUsed:cnt.filter(c=>c>0).length};
}

const TX = TX_PAIRS.slice().sort((a,b)=>b[0].length-a[0].length);
const TX_RE = new RegExp(TX.map(p=>p[0].replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|"),"g");
const TX_MAP = TX.reduce((m,[a,b])=>(m[a]=b,m),{});

function tx(s){
  if(LANG==="th" || s==null) return s;
  return String(s).replace(TX_RE, m=>TX_MAP[m]);
}

/* Whole sentences — insights, tips, narrative captions — are written out
   in both languages rather than stitched from the vocabulary above.
   Fragment substitution is fine for labels but turns prose into pidgin,
   so anything that reads as a sentence goes through L() instead.      */
const L = (th,en)=> LANG==="en" ? en : th;

function setLang(l){
  if(l===LANG) return;
  LANG = l;
  document.documentElement.lang = l;
  const th=document.getElementById("langTH"), en=document.getElementById("langEN");
  if(th) th.setAttribute("aria-pressed", String(l==="th"));
  if(en) en.setAttribute("aria-pressed", String(l==="en"));
  /* chrome outside #app is static markup, so translate it in place */
  document.querySelectorAll("[data-i18n-th]").forEach(el=>{
    el.textContent = l==="en" ? tx(el.dataset.i18nTh) : el.dataset.i18nTh;
  });
  document.querySelectorAll("[title]").forEach(el=>{
    if(!el.dataset.i18nTitle) el.dataset.i18nTitle = el.getAttribute("title");
    el.setAttribute("title", l==="en" ? tx(el.dataset.i18nTitle) : el.dataset.i18nTitle);
  });
  render();
}
function series(base,drift,wig,n=41){const a=[];for(let i=0;i<n;i++)a.push(Math.max(0,Math.round((base+drift*i+Math.sin(i*.8)*wig+((i%3)-1)*wig*.35)*10)/10));return a;}

/* deterministic 41-year back-extension: last 5 points ARE the dataset years */
function lxBackSeries(trend, n){
  n = n || 41;
  const real = LX_YEARS.map(y=>trend[y]);
  const first = real[0];
  const growth = Math.pow(real[4]/real[0], 1/4);   // avg annual factor over the 5 real years
  const damp   = 1 + (growth-1)*0.55;              // damped further back in time
  const out=[];
  for(let i=n-5-1;i>=0;i--) out.unshift( (out.length?out[0]:first)/damp );
  const back = out.slice(0, n-5);
  // gentle deterministic waviness so the line is not a perfect curve
  const wig = back.map((v,i)=> v*(1 + Math.sin(i*0.8)*0.018 + ((i%3)-1)*0.006));
  return wig.concat(real);
}
function lxYearAt(i,n){ n=n||41; return LX_YEARS[4]-(n-1-i); }

function donut(segs,total,top,bottom,o){
  o=o||{};
  const size=140,th=24,r=(size-th)/2,cx=size/2,cir=2*Math.PI*r;let acc=0;
  const c=segs.map(s=>{
    const f=s.value/total,d=f*cir;
    const e=`<circle class="hv" cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${th}" stroke-dasharray="${d} ${cir-d}" stroke-dashoffset="${-acc*cir}" transform="rotate(-90 ${cx} ${cx})"${TIP({
        t:s.name, sub:(o.loc||"ประเทศไทย")+" · "+(o.period||YR),
        rows:[{l:o.metric||"พื้นที่",v:fmt(s.value)+" "+(o.unit||"ไร่"),sw:s.color},
              {l:"สัดส่วน",v:(f*100).toFixed(1)+"%"},
              {l:"รวมทั้งหมด",v:fmt(total)+" "+(o.unit||"ไร่")},
              {l:"หมวด",v:o.cat||"—"},{l:"ช่วงเวลา",v:o.period||YR}]})}/>`;
    acc+=f;return e;}).join("");
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}"><circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="#EEEBE3" stroke-width="${th}"/>${c}<text x="${cx}" y="${cx-2}" text-anchor="middle" font-size="19" font-weight="900" fill="var(--ink)">${top}</text><text x="${cx}" y="${cx+15}" text-anchor="middle" font-size="10" fill="var(--hint)">${bottom}</text></svg>`;
}

function multiline(seriesArr,opt){

  const ev=(opt.events||[]).map(e=>{const i=e.year-2528;if(i<0||i>40)return "";const x=X(i).toFixed(1);const col=e.color||'#B0A99A';return `<line x1="${x}" y1="${pT}" x2="${x}" y2="${h-pB}" stroke="${col}" stroke-dasharray="3 3" stroke-width="1"/><text x="${x}" y="${pT-5}" text-anchor="middle" style="font-size:7.5px;font-weight:700;fill:${col}" font-family="inherit">${e.label}</text>`;}).join("");
  const lines=seriesArr.map(s=>{
    const d=s.data.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(" ");
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.2" opacity=".95"/>`;}).join("");
  /* hover targets on the 5 reporting years (the values that come from the dataset) */
  const dots=seriesArr.map(s=>LX_YEARS.map((yr,k)=>{
    const i=n-5+k, v=s.data[i], prev=k?s.data[i-1]:null;

    return `<circle class="hv" cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${k===4?4:3.4}" fill="${s.color}" stroke="#fff" stroke-width="1.5"${TIP({
      t:s.label, sub:(opt.loc||"ประเทศไทย")+" · พ.ศ. "+yr,
      rows:[{l:"ค่า",v:(opt.fmtV?opt.fmtV(v):fmt(Math.round(v)))+" "+(opt.unit||""),sw:s.color}]
        .concat(dv!=null?[{l:"เทียบปีก่อน",v:(dv>0?"+":"")+dv.toFixed(1)+"%",c:dv>0?"#A41210":"#14673C"}]:[])
        .concat([{l:"หมวด",v:opt.cat||"—"},{l:"ขอบเขต",v:opt.loc||"ประเทศไทย"},{l:"ช่วงเวลา",v:"พ.ศ. "+yr}]),
      foot:"ค่าจากชุดข้อมูล LANDX · "+MOCKNOTE})}/>`;}).join("")).join("");
  /* faint hover targets on the back-extension (clearly labelled as estimated) */
  const back=seriesArr.length===1?seriesArr[0].data.map((v,i)=>{
    if(i%5!==0 || i>=n-5) return "";
    return `<circle class="hv" cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="6" fill="transparent"${TIP({
      t:seriesArr[0].label, sub:"พ.ศ. "+lxYearAt(i,n),
      rows:[{l:"ค่าประมาณ",v:fmt(Math.round(v))+" "+(opt.unit||"")},
            {l:"หมวด",v:opt.cat||"—"},{l:"ขอบเขต",v:opt.loc||"ประเทศไทย"}],
      foot:"ประมาณการย้อนหลังจากอัตราการเปลี่ยนแปลงของชุดข้อมูล · "+MOCKNOTE})}/>`;}).join(""):"";
  const leg=`<div class="tl">`+seriesArr.map(s=>`<span><span class="sw" style="background:${s.color}"></span>${s.label}</span>`).join("")+`</div>`;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%"><text x="${pL-30}" y="12" class="axis">${opt.unit||''}</text>${grid}${xl}${ev}${lines}${back}${dots}</svg>${leg}`+(opt.src?srcFooter(opt.src):"");

/* ★ REAL-series line chart — plots an arbitrary year→value series.
   Used only where the new GISTDA data supports a genuine time series. */
function realLine(years, values, opt){
  opt=opt||{};
  const w=560,h=200,pL=40,pR=14,pT=18,pB=26,n=years.length;
  const hi=opt.hi!=null?opt.hi:Math.max(...values)*1.08, lo=opt.lo!=null?opt.lo:0;
  const X=i=>pL+(n===1?0:(i/(n-1))*(w-pL-pR)), Y=v=>pT+(1-(v-lo)/((hi-lo)||1))*(h-pT-pB);
  const grid=[0,.5,1].map(t=>{const v=lo+(hi-lo)*t;
    return `<line x1="${pL}" y1="${Y(v).toFixed(1)}" x2="${w-pR}" y2="${Y(v).toFixed(1)}" stroke="rgba(0,0,0,.05)"/>`+
           `<text x="${pL-6}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end" class="axis">${opt.fmtAxis?opt.fmtAxis(v):Math.round(v)}</text>`;}).join("");
  const every=opt.labelEvery || 2;   /* long series need sparser x labels */
  const xl=years.map((y,i)=> (i%every===0||i===n-1)
    ? `<text x="${X(i).toFixed(1)}" y="${h-8}" text-anchor="middle" class="axis">${y}</text>` : "").join("");
  const ev=(opt.events||[]).map(e=>{const i=years.indexOf(e.year); if(i<0) return "";
    const x=X(i).toFixed(1), col=e.color||'#B0A99A';
    return `<line x1="${x}" y1="${pT}" x2="${x}" y2="${h-pB}" stroke="${col}" stroke-dasharray="3 3" stroke-width="1"/>`+
           `<text x="${x}" y="${pT-5}" text-anchor="middle" style="font-size:7.5px;font-weight:700;fill:${col}" font-family="inherit">${e.label}</text>`;}).join("");
  const path=values.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(" ");
  const line=`<path d="${path}" fill="none" stroke="${opt.color||'#2E6FAE'}" stroke-width="2.2" opacity=".95"/>`;
  const dots=values.map((v,i)=>{
    const prev=i?values[i-1]:null, dv=prev?((v-prev)/prev*100):null;
    const isLast=i===n-1;
    return `<circle class="hv" cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${isLast?4.2:3.2}" fill="${opt.color||'#2E6FAE'}" stroke="#fff" stroke-width="1.5"${TIP({
      t:opt.label||"ค่า", sub:(opt.loc||"ประเทศไทย")+" · พ.ศ. "+years[i],
      rows:[{l:opt.metric||"ค่า", v:(opt.fmtV?opt.fmtV(v):fmt(Math.round(v)))+" "+(opt.unit||""), sw:opt.color||'#2E6FAE'}]
        .concat(dv!=null?[{l:"เทียบปีก่อน",v:(dv>0?"+":"")+dv.toFixed(1)+"%",c:dv>0?"#A41210":"#14673C"}]:[])
        .concat(opt.extraRows?opt.extraRows(i):[])
        .concat([{l:"หมวด",v:opt.cat||"—"},{l:"ขอบเขต",v:opt.loc||"ประเทศไทย"},{l:"ช่วงเวลา",v:"พ.ศ. "+years[i]}]),
      foot:opt.foot||REALNOTE})}/>`;}).join("");
  const leg=`<div class="tl"><span><span class="sw" style="background:${opt.color||'#2E6FAE'}"></span>${opt.label||""}</span></div>`;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%"><text x="6" y="12" class="axis">${opt.unit||''}</text>${grid}${xl}${ev}${line}${dots}</svg>${leg}`;
}

/* ---------- DRILL-DOWN (content left · map right) ---------- */
function panelBlock(p,wide){
  /* .pcont takes the free space so the Insight box sits flush with the
     bottom of a stretched card instead of leaving a gap under it        */
  const inner = wide
    ? `<div class="pbody"><div class="trendbody"><div class="cw">${p.body()}</div><div class="ic">${insightBox(p.insight)}</div></div></div>`
    : `<div class="pbody"><div class="pcont">${p.body()}</div>${insightBox(p.insight)}</div>`;
  return `<div class="panel${wide?' wide':''}"><div class="ph"><span class="pt">${p.title}</span><span style="margin-left:auto;display:inline-flex;align-items:center;gap:8px">${p.tag||tagMock()}${infoIcon(p.tip)}</span></div>${inner}</div>`;
}

/* Column composition per domain. A plain two-up row leaves a hole under
   whichever panel is shorter, so domains with a third panel stack the two
   short ones beside the tall one and let the column stretch to match.   */
function domainBody(id,d){
  const A=()=>panelBlock(d.panelA), B=()=>panelBlock(d.panelB),
        C=()=>panelBlock(d.panelC), T=()=>panelBlock(d.trend,true);
  const col=(...kids)=>`<div class="stackcol">${kids.join("")}</div>`;
  switch(id){
    /* tall year-ranking beside [balance · regional] */
    case "forest":    return `<div class="toprow">${A()}${col(B(),C())}</div>${T()}`;
    /* tall province ranking beside [by land-use type · by month] —
       C before B as requested                                           */
    case "flood":     return `<div class="toprow">${A()}${col(C(),B())}</div>${T()}`;
    /* donut is short and the province ranking is tall: pair the donut
       with the trend line so both columns land at a similar height      */
    case "community": return `<div class="toprow">${col(A(),T())}${B()}</div>`;
    default:          return `<div class="toprow">${A()}${B()}</div>${T()}`;
  }
}

function domainHTML(id){
  const d=buildDomains()[id];
  return `<div class="page-h"><span class="pico">${d.icon}</span> ${d.title} ${badge(d.sev)}</div>
   <div class="dd-layout">
     <div class="leftcol">${domainBody(id,d)}</div>
     <div class="mapcol">${mapPanel(id)}</div>
   </div>`;
}

/* ═══════════════════════════════════════════════════════════════════
   ★ REAL LAYERS — hover tooltips driven by GISTDA's own tile attributes
   Land use tiles carry: landuse_code1/2/3, landuse_des1/2/3_th|en,
                         Rai, Shape_Area, pv_tn, ap_tn, tb_tn, year
   Flood tiles carry:    area_rai, area, pv_tn, ap_tn, tb_tn, re_royin
   ═══════════════════════════════════════════════════════════════════ */
/* GISTDA is inconsistent between the two datasets: the flood tiles store
   "จ.เชียงใหม่ / อ.หางดง / ต.บ้านแหวน" while the land-use tiles store the
   bare names "เชียงใหม่ / สะเมิง / ยั้งเมิน". Normalise for display and
   keep the raw form for filtering (see PV_FILTER below).               */
const pfx=(v,p)=> v ? (String(v).startsWith(p) ? String(v) : p+v) : "";
const rawEsc=v=>String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
/* Values that arrive on the tile are free Thai text, so they can't go through
   tx()'s fragment substitution — that corrupts them (the "ปี" inside
   "นาข้าวปีละครั้ง" becomes "year", giving "นาข้าวyearละครั้ง"). Instead the
   template is translated first, then the value is dropped in afterwards via
   rawVal(), which picks a genuine English source when one exists:
     · the tile's own _en twin (landuse_des1/2/3_en)
     · a lookup table for the closed sets (regions, and level-1 land classes,
       which the LU2567 dataset already carries an `en` name for)
   and only falls back to the Thai when neither exists — e.g. tambon and
   amphoe names, which have no romanisation anywhere in this data.        */
const RE_ROYIN_EN = {
  "เหนือ":"North", "ใต้":"South", "กลาง":"Central", "ตะวันออก":"East", "ตะวันตก":"West",
  "ตะวันออกเฉียงเหนือ":"Northeast", "ภาคเหนือ":"North", "ภาคใต้":"South", "ภาคกลาง":"Central",
  "ภาคตะวันออก":"East", "ภาคตะวันตก":"West", "ภาคตะวันออกเฉียงเหนือ":"Northeast"
};
/* pick the best available rendering of a raw tile value for the active language */
function rawVal(th, en){
  const v = (LANG==="en" && en && String(en).trim()) ? en : th;
  return rawEsc(v==null || v==="" ? "—" : v);
}
function realTooltipHTML(kind, p){
  /* province names are a closed set the dictionary already covers, so those
     translate; tambon/amphoe stay Thai for lack of an English source      */
  const place = [pfx(p.tb_tn,"ต."), pfx(p.ap_tn,"อ."), pfx(p.pv_tn,"จ.")].filter(Boolean).join(" · ") || "ไม่ระบุพื้นที่";
  const placeHTML = tx(place);
  const pvHeadHTML = tx(pfx(p.pv_tn,"จ.")||"");
  if(kind==="landuse"){
    const cat = ({A:"agri",F:"forest",U:"urban",M:"misc",W:"water"})[String(p.landuse_code1||"")[0]];
    const col = cat ? LU2567_BY_ID[cat].color : "#BDBDBD";
    const rows = [
      tx(`<div class="tt-r"><span class="tt-sw" style="background:${col}"></span>ประเภทหลัก<b>__D1__</b><i>${p.landuse_code1||""}</i></div>`),
      tx(`<div class="tt-r">ประเภทย่อย<b>__D2__</b><i>${p.landuse_code2||""}</i></div>`),
      tx(`<div class="tt-r">ระดับละเอียด<b>__D3__</b><i>${p.landuse_code3||""}</i></div>`),
      tx(`<div class="tt-r">พื้นที่แปลง<b>${p.Rai!=null?fmt(Math.round(p.Rai))+" ไร่":"—"}</b></div>`),
      tx(`<div class="tt-r">ปีข้อมูล<b>พ.ศ. ${p.year||"2567"}</b></div>`)
    ].join("")
      /* level 1 is a closed set — fall back to the dataset's own English name
         for it when the tile doesn't ship a _en twin                       */
      .replace("__D1__", rawVal(p.landuse_des1_th, p.landuse_des1_en || (cat && LU2567_BY_ID[cat].en)))
      .replace("__D2__", rawVal(p.landuse_des2_th, p.landuse_des2_en))
      .replace("__D3__", rawVal(p.landuse_des3_th, p.landuse_des3_en));
    return `<div class="tt"><div class="tt-h">${pvHeadHTML||tx("การใช้ประโยชน์ที่ดิน")}<small>${placeHTML}</small></div>
      <div class="tt-b">${rows}</div>
      <div class="tt-f">${tx("การใช้ประโยชน์ที่ดิน · ปี พ.ศ. 2567")}</div></div>`;
  }
  const provRow = LX2567.flood.byProvince.find(x=>x[1]===String(p.pv_tn||"").replace("จ.",""));
  const rows = [
    tx(`<div class="tt-r"><span class="tt-sw" style="background:${LX2567.flood.color}"></span>พื้นที่น้ำท่วม (แปลงนี้)<b>${p.area_rai!=null?fmt(Math.round(p.area_rai))+" ไร่":"—"}</b></div>`),
    provRow?tx(`<div class="tt-r">รวมทั้งจังหวัด<b>${fmt(provRow[3])} ไร่</b><i>${(provRow[3]/LX2567.flood.footprintRai*100).toFixed(1)}%</i></div>`):"",
    provRow?tx(`<div class="tt-r">อันดับประเทศ<b>${LX2567.flood.byProvince.findIndex(x=>x[0]===provRow[0])+1} / ${LX2567.flood.byProvince.length}</b></div>`):"",
    tx(`<div class="tt-r">ภูมิภาค<b>__RG__</b></div>`)
      .replace("__RG__", rawVal(p.re_royin, RE_ROYIN_EN[String(p.re_royin||"").trim()]))
  ].join("");
  return `<div class="tt"><div class="tt-h">${pvHeadHTML||tx("พื้นที่น้ำท่วม")}<small>${placeHTML}</small></div>
    <div class="tt-b">${rows}</div>
    <div class="tt-f">${tx("ขอบเขตน้ำท่วมทั้งปี พ.ศ. 2567")}</div></div>`;
}
function lxAttachRealInteractions(map){
  const HIT={ "lu2567-fill":"landuse", "fl2567-fill":"flood" };
  let popup=null;
  Object.keys(HIT).filter(id=>map.getLayer(id)).forEach(layerId=>{
    map.on("mousemove", layerId, e=>{
      if(!e.features || !e.features.length) return;
      map.getCanvas().style.cursor="pointer";
      if(!popup) popup=new maplibregl.Popup({closeButton:false,closeOnClick:false,maxWidth:"320px",offset:12});
      /* realTooltipHTML translates its own template internally (and shields
         the raw GISTDA text fields while doing so) — don't wrap it in tx()
         again here, or the raw values get a second, corrupting pass.     */
      popup.setLngLat(e.lngLat).setHTML(realTooltipHTML(HIT[layerId], e.features[0].properties)).addTo(map);
    });
    map.on("mouseleave", layerId, ()=>{
      map.getCanvas().style.cursor="";
      if(popup){ popup.remove(); popup=null; }
    });
  });
}

/* ═══ ★ LANDTRENDR raster layer ════════════════════════════════════
   The layer is a PNG coverage, so tiles carry no attributes and MapLibre
   cannot query them. To still give a real hover/click readout we fetch
   the tile under the pointer, decode it once, cache it, and read the
   exact pixel — then map its colour back to a year through the same
   lookup GISTDA ships. That reproduces per-pixel detail without the
   login their own site requires for it.                              */
const LT_TILE_CACHE = new Map();     /* "z/x/y" → ImageData | null */
function ltTileUrl(z,x,y){
  return LANDTRENDR.meta.tileUrl
    .replace("{z}",z).replace("{x}",x).replace("{y}",y)
    .replace("{TOKEN}", encodeURIComponent(LANDTRENDR.meta.token||""));
}
function ltHasToken(){ return !!(LANDTRENDR.meta.token && LANDTRENDR.meta.token.length>20); }

async function ltReadPixel(lng, lat, zoom){
  if(!ltHasToken()) return null;
  const z=Math.min(Math.max(Math.round(zoom),5),14);
  const n=2**z, la=lat*Math.PI/180;
  const fx=(lng+180)/360*n;
  const fy=(1-Math.log(Math.tan(la)+1/Math.cos(la))/Math.PI)/2*n;
  const x=Math.floor(fx), y=Math.floor(fy);
  const px=Math.min(255,Math.max(0,Math.floor((fx-x)*256)));
  const py=Math.min(255,Math.max(0,Math.floor((fy-y)*256)));
  const key=z+"/"+x+"/"+y;
  let img=LT_TILE_CACHE.get(key);
  if(img===undefined){
    try{
      const r=await fetch(ltTileUrl(z,x,y));
      if(r.status===401||r.status===403){ ltMarkExpired(); LT_TILE_CACHE.set(key,null); return null; }
      if(!r.ok){ LT_TILE_CACHE.set(key,null); return null; }
      const b=await r.blob();
      if(!b.size){ LT_TILE_CACHE.set(key,null); return null; }
      const bmp=await createImageBitmap(b);
      const cv=document.createElement("canvas"); cv.width=bmp.width; cv.height=bmp.height;
      const g=cv.getContext("2d",{willReadFrequently:true});
      g.drawImage(bmp,0,0);
      img=g.getImageData(0,0,bmp.width,bmp.height);
      if(LT_TILE_CACHE.size>120) LT_TILE_CACHE.clear();
      LT_TILE_CACHE.set(key,img);
    }catch(e){ LT_TILE_CACHE.set(key,null); return null; }
  }
  if(!img) return null;
  const i=(py*img.width+px)*4, d=img.data;
  if(d[i+3]<128) return {empty:true};
  const hex="#"+[d[i],d[i+1],d[i+2]].map(v=>v.toString(16).padStart(2,"0")).join("").toUpperCase();
  const be=LT_LUT[hex];
  return be ? {be, hex, row:LT_BY_YEAR[be]} : {unknown:hex};
}

function ltPopupHTML(hit, lng, lat){
  if(!hit) return null;
  const coord=`${lat.toFixed(5)}, ${lng.toFixed(5)}`;
  if(hit.empty) return `<div class="tt"><div class="tt-h">ไม่พบการเปลี่ยนแปลง<small>${coord}</small></div>
    <div class="tt-b"><div class="tt-r">พิกเซลนี้ไม่ถูกจัดว่ามีการเปลี่ยนแปลง ในช่วง พ.ศ. 2532–2567</div></div>
    <div class="tt-f">${LANDTRENDR.meta.sourceTH}</div></div>`;
  if(hit.unknown) return `<div class="tt"><div class="tt-h">ค่าที่ไม่รู้จัก<small>${coord}</small></div>
    <div class="tt-b"><div class="tt-r">สี<b>${hit.unknown}</b></div></div></div>`;
  const r=hit.row, merged=LANDTRENDR.mergedClasses[r.be];
  const rank=LT_TOP.findIndex(x=>x.be===r.be)+1;
  return `<div class="tt">
    <div class="tt-h">ปีที่เปลี่ยนแปลงมากที่สุด · ${merged?"พ.ศ. "+merged.join(" หรือ "):"พ.ศ. "+r.be}<small>${coord}</small></div>
    <div class="tt-b">
      <div class="tt-r"><span class="tt-sw" style="background:${r.hex}"></span>ชั้นข้อมูล<b>${merged?"พ.ศ. "+merged.join("+"):"พ.ศ. "+r.be}</b></div>
      <div class="tt-r">พื้นที่รวมทั้งประเทศของชั้นนี้<b>${fmtLT(r.rai)} ไร่</b></div>
      <div class="tt-r">สัดส่วน<b>${(r.km2/LT_TOTAL_KM2*100).toFixed(2)}%</b><i>ของทั้งหมด</i></div>
      <div class="tt-r">อันดับปีที่เปลี่ยนแปลงมากสุด<b>${rank} / ${LT_TOP.length}</b></div>
      ${merged?`<div class="tt-note"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-alert-triangle"/></svg><span>2561 และ 2562 ใช้สีเดียวกัน จึงแยกสองปีนี้ไม่ได้</span></div>`:""}
    </div>
    <div class="tt-f">${LANDTRENDR.meta.sourceTH} · อ่านค่าจากพิกเซลจริงบนไทล์</div></div>`;
}

let ltExpired=false;
function ltMarkExpired(){
  if(ltExpired) return; ltExpired=true;
  const el=document.getElementById("ltTokenBox"); if(el) el.style.display="block";
  if(lxMap && lxMap.getLayer("landtrendr-raster"))
    lxMap.setLayoutProperty("landtrendr-raster","visibility","none");
}
function ltApplyToken(){
  const inp=document.getElementById("ltTokenInput"); if(!inp) return;
  const v=inp.value.trim(); if(v.length<20) return;
  LANDTRENDR.meta.token=v; ltExpired=false; LT_TILE_CACHE.clear();
  const box=document.getElementById("ltTokenBox"); if(box) box.style.display="none";
  if(lxMap){ try{
    if(lxMap.getLayer("landtrendr-raster")) lxMap.removeLayer("landtrendr-raster");
    if(lxMap.getSource("landtrendr")) lxMap.removeSource("landtrendr");
    ltAddLayer(lxMap);
    const cb=document.querySelector('.ml-toggle[data-layers="landtrendr-raster"]');
    if(cb) cb.checked=true;
  }catch(e){ console.warn("[landtrendr] re-add failed",e); } }
}
function ltAddLayer(map){
  if(!ltHasToken()) return false;
  map.addSource("landtrendr",{
    type:"raster", tiles:[ltTileUrl("{z}","{x}","{y}")], tileSize:256,
    minzoom:LANDTRENDR.meta.minzoom, maxzoom:14,
    bounds:LANDTRENDR.meta.bbox,
    attribution:"บริเวณพื้นที่ป่าที่เกิดการเปลี่ยนแปลง · LandTrendr"
  });
  map.addLayer({ id:"landtrendr-raster", type:"raster", source:"landtrendr",
    paint:{"raster-opacity":0.85} });
  return true;
}
function ltAttach(map){
  let tmr=null, popup=null;
  const show=async(e)=>{
    if(!ltHasToken() || ltExpired) return;
    if(!map.getLayer("landtrendr-raster")) return;
    if(map.getLayoutProperty("landtrendr-raster","visibility")==="none") return;
    const hit=await ltReadPixel(e.lngLat.lng, e.lngLat.lat, map.getZoom());
    const html=ltPopupHTML(hit, e.lngLat.lng, e.lngLat.lat);
    if(!html){ if(popup){popup.remove();popup=null;} return; }
    if(!popup) popup=new maplibregl.Popup({closeButton:false,closeOnClick:false,maxWidth:"320px",offset:12});
    popup.setLngLat(e.lngLat).setHTML(tx(html)).addTo(map);
  };
  map.on("mousemove", e=>{ clearTimeout(tmr); tmr=setTimeout(()=>show(e), 140); });
  map.on("click", e=>{ clearTimeout(tmr); show(e); });
  map.on("mouseout", ()=>{ clearTimeout(tmr); if(popup){popup.remove();popup=null;} });
  /* a tile 401 surfaces here too, not just through the pixel reader */
  map.on("error", ev=>{
    const u=ev && ev.error && (ev.error.url||"");
    const st=ev && ev.error && ev.error.status;
    if(String(u).includes("landtrendr") && (st===401||st===403)) ltMarkExpired();
  });
}

/* ══════════════════════════════════════════════════════════════════
   ★ BASEMAP — "survey paper"
   ------------------------------------------------------------------
   Replaces the raster OSM tiles with a vector style built on GISTDA's
   own public OpenMapTiles service. Raster tiles could only be tinted
   wholesale (raster-saturation / -contrast); vector lets each element
   be coloured on purpose — which is the only way to give province
   boundaries their own light-brown treatment.

   The brief for this basemap is subtraction. Seven saturated thematic
   colours sit on top of it (agri #1BB161 · forest #6FD195 · urban
   #FDC003 · misc #FFAE4C · water #0692F1 · flood #1AA3DD · change
   #BA6903). Anything competing with those is noise, so:

   • Water is warm sage #E4E6E0, NOT blue. A blue basemap would fight
     the flood layer, which is the one thing users look for first.
   • No bold weight anywhere. Hierarchy comes from size, colour and
     letter-spacing instead — quieter, and it happens to be the only
     option since the Thai glyph range exists solely in the Regular cut.
   • Province labels are tinted the same brown as province boundaries,
     so the administrative layer reads as one system.
   • Palette is pulled from the dashboard's own tokens (--tan #C0A16B,
     --bg #FAFAF8) rather than invented, so map and UI share a surface.

   All endpoints below are public — no key, no token.
   ══════════════════════════════════════════════════════════════════ */
const LX_BASE = {
  tiles:"https://vallaris.dragonfly.gistda.or.th/core/api/tiles/1.0-beta/tiles/public/osm/{z}/{x}/{y}",
  glyphs:"https://vallaris.dragonfly.gistda.or.th/core/tiles/fonts/{fontstack}/{range}.pbf",
  font:["Noto Sans Regular"],          /* the only cut with Thai coverage */
  paper:"#F6F3ED", land:"#EFEBE1", park:"#EDF0E6", builtup:"#EFE9DE",
  water:"#E4E6E0", waterway:"#D9DDD4", building:"#F0EBE1",
  roadCase:"#E7E0D3", roadFill:"#FDFCF9",
  admin:"#C0A16B",                     /* --tan · province boundary     */
  adminCountry:"#A8804A",
  labelProv:"#A48A61", labelCity:"#7D766A", labelCountry:"#9A9184",
  halo:"rgba(255,253,248,0.92)"
};
/* label layers are lifted above the thematic layers after load */
const LX_BASE_LABELS = ["label-country","label-province","label-city"];

function lxBaseStyle(){
  const B=LX_BASE;
  return {
    version:8,
    glyphs:B.glyphs,
    sources:{
      base:{ type:"vector", tiles:[B.tiles], minzoom:0, maxzoom:14,
        attribution:"&copy; OpenStreetMap contributors" }
    },
    layers:[
      { id:"bg", type:"background", paint:{"background-color":B.paper} },

      /* ground cover — barely there, just enough to hint at terrain */
      { id:"landcover", type:"fill", source:"base", "source-layer":"landcover",
        filter:["in",["get","class"],["literal",["wood","forest","grass","scrub","farmland"]]],
        paint:{"fill-color":B.land,"fill-opacity":0.5} },
      /* settlement — the only tonal variation visible at national zoom,
         so cities read as soft patches rather than nothing at all */
      { id:"builtup", type:"fill", source:"base", "source-layer":"landuse",
        filter:["in",["get","class"],["literal",["residential","industrial","quarter","commercial"]]],
        paint:{"fill-color":B.builtup,"fill-opacity":0.55} },
      { id:"park", type:"fill", source:"base", "source-layer":"park",
        paint:{"fill-color":B.park,"fill-opacity":0.55} },

      { id:"water", type:"fill", source:"base", "source-layer":"water",
        paint:{"fill-color":B.water} },
      { id:"waterway", type:"line", source:"base", "source-layer":"waterway", minzoom:8,
        paint:{"line-color":B.waterway,
          "line-width":["interpolate",["linear"],["zoom"],8,0.4,12,1,14,1.6]} },

      { id:"building", type:"fill", source:"base", "source-layer":"building", minzoom:13,
        paint:{"fill-color":B.building,"fill-opacity":0.55} },

      /* roads appear late and stay pale — orientation, not emphasis */
      { id:"road-case", type:"line", source:"base", "source-layer":"transportation", minzoom:7,
        filter:["in",["get","class"],["literal",["motorway","trunk","primary","secondary"]]],
        layout:{"line-join":"round","line-cap":"round"},
        paint:{"line-color":B.roadCase,
          "line-width":["interpolate",["exponential",1.5],["zoom"],7,1.1,11,3.2,14,7]} },
      { id:"road", type:"line", source:"base", "source-layer":"transportation", minzoom:7,
        filter:["in",["get","class"],["literal",["motorway","trunk","primary","secondary"]]],
        layout:{"line-join":"round","line-cap":"round"},
        paint:{"line-color":B.roadFill,
          "line-width":["interpolate",["exponential",1.5],["zoom"],7,0.4,11,1.8,14,4.4]} },

      /* ── the one deliberate accent: administrative structure ── */
      { id:"boundary-province", type:"line", source:"base", "source-layer":"boundary", minzoom:3,
        filter:["all",[">=",["get","admin_level"],3],["!=",["get","maritime"],1]],
        layout:{"line-join":"round","line-cap":"round"},
        paint:{"line-color":B.admin,
          "line-width":["interpolate",["linear"],["zoom"],3,0.4,6,0.7,10,1.1,14,1.6],
          "line-opacity":["interpolate",["linear"],["zoom"],3,0.45,6,0.7,10,0.8],
          "line-dasharray":[2.6,1.9]} },
      { id:"boundary-country", type:"line", source:"base", "source-layer":"boundary", minzoom:1,
        filter:["all",["<=",["get","admin_level"],2],["!=",["get","maritime"],1]],
        layout:{"line-join":"round","line-cap":"round"},
        paint:{"line-color":B.adminCountry,
          "line-width":["interpolate",["linear"],["zoom"],1,0.6,5,1.1,10,1.9],
          "line-opacity":0.62} },

      /* ── labels: Thai first, single line, no bold ── */
      { id:"label-country", type:"symbol", source:"base", "source-layer":"place",
        minzoom:2, maxzoom:7,
        filter:["==",["get","class"],"country"],
        layout:{"text-field":["coalesce",["get","name:th"],["get","name"]],
          "text-font":B.font, "text-letter-spacing":0.22,
          "text-size":["interpolate",["linear"],["zoom"],2,9,5,12],
          "text-max-width":7, "text-padding":6},
        paint:{"text-color":B.labelCountry,"text-halo-color":B.halo,"text-halo-width":1.4} },

      { id:"label-province", type:"symbol", source:"base", "source-layer":"place",
        minzoom:5,
        filter:["in",["get","class"],["literal",["state","province"]]],
        layout:{"text-field":["coalesce",["get","name:th"],["get","name"]],
          "text-font":B.font, "text-letter-spacing":0.06,
          "text-size":["interpolate",["linear"],["zoom"],5,8.5,8,10.5,11,12],
          "text-max-width":8, "text-padding":5},
        paint:{"text-color":B.labelProv,"text-halo-color":B.halo,"text-halo-width":1.5} },

      { id:"label-city", type:"symbol", source:"base", "source-layer":"place",
        minzoom:7,
        filter:["in",["get","class"],["literal",["city","town"]]],
        layout:{"text-field":["coalesce",["get","name:th"],["get","name"]],
          "text-font":B.font,
          "text-size":["interpolate",["linear"],["zoom"],7,9.5,11,12,14,14],
          "text-max-width":9, "text-padding":4,
          "text-anchor":"top","text-offset":[0,0.35]},
        paint:{"text-color":B.labelCity,"text-halo-color":B.halo,"text-halo-width":1.5} }
    ]
  };
}

/* ---------- GIS map lifecycle ---------- */
let lxMap=null;
function initMap(id){
  if(lxMap){ try{lxMap.remove();}catch(e){} lxMap=null; }
  const box=document.getElementById("lxmap");
  if(!box) return;
  if(typeof maplibregl==="undefined"){
    box.innerHTML=tx(`<div style="display:grid;place-items:center;height:100%;text-align:center;padding:24px;
      font-size:13px;color:#9A5800;background:#FFF6E0;line-height:1.6">
      <div><b>ไม่สามารถโหลดไลบรารีแผนที่ (MapLibre GL) ได้</b><br>
      ตรวจสอบการเชื่อมต่ออินเทอร์เน็ต แล้วรีเฟรชหน้าอีกครั้ง</div></div>`);
    return;
  }
  const map = new maplibregl.Map({
    container:"lxmap",
    style:lxBaseStyle(),
    center:LX_VIEW.center, zoom:LX_VIEW.zoom,
  });
  lxMap = map;
  map.addControl(new maplibregl.NavigationControl({showCompass:false}), "top-left");

  map.on("load", ()=>{
    /* ═══ ★ REAL LAYERS — live GISTDA vector tiles, ปี พ.ศ. 2567 ═══
       Source type is `vector` (not geojson): GISTDA serves Mapbox Vector
       Tiles through Vallaris, the tile host sends permissive CORS headers
       and the api_key is embedded in the tile URL, so MapLibre can consume
       them straight from a local file with no proxy and no login.        */

    /* Land use — one fill layer, coloured by the real `landuse_code1`
       attribute (A/F/U/M/W) using GISTDA's own palette.                  */
    map.addSource("lu2567", {
      type:"vector",
      tiles:[LX2567.landuse.tiles],
      minzoom:LX2567.landuse.minzoom,
      maxzoom:LX2567.landuse.maxzoom,
      bounds:LX2567.landuse.bbox,
      attribution:"การใช้ประโยชน์ที่ดิน · พ.ศ. 2567"
    });
    /* Visible from the source's own minimum zoom (5), so the layer is
       already painted at the default ทั่วประเทศ view. Note these tiles
       are dense (3–11 MB each) — first paint at national zoom takes a
       moment on a slow connection.                                      */
    map.addLayer({
      id:"lu2567-fill", type:"fill", source:"lu2567",
      "source-layer":LX2567.landuse.sourceLayer,
      paint:{
        "fill-color":["match",["get","landuse_code1"],
          "A",LU2567_BY_ID.agri.color, "F",LU2567_BY_ID.forest.color,
          "U",LU2567_BY_ID.urban.color,"M",LU2567_BY_ID.misc.color,
          "W",LU2567_BY_ID.water.color, "#BDBDBD"],
        "fill-opacity":0.70,
        "fill-outline-color":"rgba(0,0,0,0)"
      }
    });

    /* Coverage-frame rectangle removed per request — it read as a
       selection/crop outline rather than a data cue at national zoom. */

    /* Flood — national coverage, single class */
    map.addSource("fl2567", {
      type:"vector",
      tiles:[LX2567.flood.tiles],
      minzoom:LX2567.flood.minzoom,
      maxzoom:LX2567.flood.maxzoom,
      bounds:LX2567.flood.bbox,
      attribution:"พื้นที่น้ำท่วม · พ.ศ. 2567"
    });
    map.addLayer({
      id:"fl2567-fill", type:"fill", source:"fl2567",
      "source-layer":LX2567.flood.sourceLayer,
      paint:{"fill-color":LX2567.flood.color,"fill-opacity":0.65}
    });
    map.addLayer({
      id:"fl2567-line", type:"line", source:"fl2567",
      "source-layer":LX2567.flood.sourceLayer,
      paint:{"line-color":"#0B6E9C","line-width":0.5,"line-opacity":0.65}
    });

    /* ═══ MOCK forest-change map layer removed per request — the
       ecosystem-tab charts (FORREG etc.) still use this synthetic
       data, only the map layer + panel entry were dropped.       ═══ */

    /* ═══ ★ LANDTRENDR — บริเวณพื้นที่ป่าที่เกิดการเปลี่ยนแปลง ═══
       Two layers, added last so they paint above the vector ones:

       1. OFFLINE 2567 (default, no token) — exactly 67,855 point
          features generated from the measured density grid. Always
          available, works from a local file forever.
       2. LIVE all-years raster — the authoritative GISTDA imagery,
          but needs a 60-minute JWT. Off unless a token is supplied. */
    const lt=ltGet2567();
    map.addSource("landtrendr-2567",{type:"geojson",data:lt.fc});
    map.addLayer({
      id:"landtrendr-2567-pts", type:"circle", source:"landtrendr-2567",
      paint:{
        /* radius tracks the real ~147 m footprint of one z10 pixel, so the
           dot cloud reads at the right density as you zoom */
        "circle-radius":["interpolate",["exponential",2],["zoom"],
          4,0.6, 6,0.9, 8,1.6, 10,3.2, 12,10, 14,38],
        "circle-color":LT_DOT_COLOR,
        "circle-opacity":0.85,
        "circle-blur":0.2
      }
    });
    ltAttach2567(map);

    /* The live all-years raster was removed from the layer panel, so it is
       no longer mounted — a layer with no control is worse than no layer.
       ltAddLayer(map) / ltAttach(map) are still defined; call them and add
       a panel entry back if the all-years view is ever wanted again.      */

    lxAttachMapInteractions(map);      /* mock layer (forest change) */
    lxAttachRealInteractions(map);     /* ★ real 2567 layers         */

    /* Show only this tab's default layer(s). The panel checkboxes were
       already rendered to match, so control and map start in agreement. */
    const on = lxDefaultOn(id);
    ALL_MAP_LAYERS.forEach(lid=>{
      if(map.getLayer(lid))
        map.setLayoutProperty(lid,"visibility", on.includes(lid) ? "visible" : "none");
    });

    /* Place names belong on top of the data, not under it — thematic
       layers were appended after the basemap, so lift the labels back. */
    LX_BASE_LABELS.forEach(id=>{ if(map.getLayer(id)) map.moveLayer(id); });

    setTimeout(()=>{ if(lxMap) lxMap.resize(); }, 60);
  });

  map.on("error", e=>console.warn("[map]", e && e.error ? e.error.message : e));

  if(window.ResizeObserver){
    const ro=new ResizeObserver(()=>{ if(lxMap) lxMap.resize(); });
    ro.observe(box);
  }

  wireLegend();
}

function wireLegend(){
  document.querySelectorAll(".ml-toggle").forEach(cb=>{
    cb.onchange = ()=>{
      if(!lxMap) return;
      cb.dataset.layers.split(",").forEach(id=>{
        if(lxMap.getLayer(id)) lxMap.setLayoutProperty(id,"visibility", cb.checked?"visible":"none");
      });
    };
  });
  document.querySelectorAll(".ml-opacity").forEach(sl=>{
    sl.oninput = ()=>{
      const id=sl.dataset.layer;
      const out=document.querySelector(`.out[data-out="${id}"]`);
      if(out) out.textContent = sl.value+"%";
      if(lxMap && lxMap.getLayer(id)){
        /* each layer type has its own opacity property */
        lxMap.setPaintProperty(id,
          sl.dataset.raster ? "raster-opacity" :
          sl.dataset.circle ? "circle-opacity" : "fill-opacity", +sl.value/100);
      }
    };
  });
  const panel=document.getElementById("mapLegend");
  const reopen=document.getElementById("lpReopen");
  const closeBtn=document.getElementById("lpClose");
  if(closeBtn) closeBtn.onclick = ()=>{ if(panel) panel.style.display="none"; if(reopen) reopen.style.display="flex"; };
  if(reopen) reopen.onclick = ()=>{ if(panel) panel.style.display="flex"; reopen.style.display="none"; };
  /* the province <select> was removed earlier; its wiring call went with it */
}

/* ---------- ROUTER ---------- */
const app=document.getElementById("app");
let stack=[{v:"overview"}], ptr=0;
function render(){
  const s=stack[ptr];
  /* one translation pass over the finished markup — see tx() above */
  app.innerHTML = tx(s.v==="overview" ? overviewHTML() : domainHTML(s.d));
  document.getElementById("navBack").classList.toggle("disabled",ptr===0);
  document.getElementById("navFwd").classList.toggle("disabled",ptr>=stack.length-1);
  window.scrollTo(0,0);
  // the map lives on the drill-down pages only; initMap no-ops without #lxmap
  setTimeout(()=>initMap(s.d||"overview"),30);
}
function go(v,d){ stack=stack.slice(0,ptr+1); stack.push({v,d}); ptr++; render(); }
function back(){ if(ptr>0){ptr--; render();} }
function fwd(){ if(ptr<stack.length-1){ptr++; render();} }
render();
setLang('en'); /* default this embedded demo to English mode */
</script>
</body>
</html>
